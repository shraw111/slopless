<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Signal Shorts</title>
<meta name="description" content="The best 60–90 seconds from genuinely good long-form videos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b0c'/%3E%3Cpath d='M6 20h4l3-9 4 13 3-8h6' fill='none' stroke='%23e8ff6b' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0b0c; --card: #121214; --text: #f4f4f2; --muted: #9a9a96; --line: rgba(255,255,255,.12);
    --accent: #e8ff6b; --accent-text: #0b0b0c; --chip: rgba(255,255,255,.08);
    --top: calc(env(safe-area-inset-top) + 56px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 15px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  a { color: inherit; }

  /* topic chips */
  header { position: fixed; z-index: 20; inset: 0 0 auto 0; padding: env(safe-area-inset-top) 0 0;
    background: linear-gradient(rgba(0,0,0,.55), transparent); pointer-events: none; }
  header .chips { pointer-events: auto; }
  .chips { display: flex; gap: 8px; padding: 10px 16px 14px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.14);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--text);
    font-size: 14px; font-weight: 600; white-space: nowrap; transition: background .15s, color .15s; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  .chip .n { opacity: .55; font-weight: 500; margin-left: 4px; }

  /* feed */
  /* A fixed full-screen layer: the browser's address bar never resizes cards mid-swipe. */
  #feed { position: fixed; inset: 0; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain;
    scrollbar-width: none; }
  #feed::-webkit-scrollbar { display: none; }
  .card { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
    padding: var(--top) 16px calc(env(safe-area-inset-bottom) + 20px); }
  .card > * { position: relative; z-index: 1; }
  /* Shorts-style backdrop: the video's own thumbnail, blurred, fills the screen */
  .card > .bg { position: absolute; z-index: 0; inset: -40px; background: #000 center / cover no-repeat;
    filter: blur(28px) brightness(.38) saturate(1.3); }
  .meta-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .tag { color: var(--accent); font-weight: 700; letter-spacing: .02em; text-transform: uppercase; font-size: 12px; }
  .hook { margin: 0; font-size: clamp(22px, 6.4vw, 30px); line-height: 1.15; font-weight: 750;
    letter-spacing: -.02em; text-wrap: balance; }
  .stage { position: relative; width: calc(100% + 32px); margin: 0 -16px; aspect-ratio: 16 / 9; overflow: hidden;
    background: #000 center / cover no-repeat; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .stage iframe, .stage .player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* thumbnail stays on top until the video is really playing, so there is no black flash */
  .poster { position: absolute; inset: 0; z-index: 1; background: #000 center / cover no-repeat;
    transition: opacity .35s; pointer-events: none; }
  .stage.playing .poster { opacity: 0; }
  .tap { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; }
  .pill { position: absolute; z-index: 3; left: 10px; bottom: 12px; display: flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 999px; background: rgba(0,0,0,.66); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); font-size: 13px; font-weight: 600; pointer-events: none;
    transition: opacity .3s; }
  .pill svg { width: 16px; height: 16px; fill: currentColor; }
  .stage.sound .pill { opacity: 0; }
  .paused-icon { width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,.55); display: none;
    place-items: center; }
  .paused-icon svg { width: 28px; height: 28px; fill: #fff; margin-left: 4px; }
  .stage.paused .paused-icon { display: grid; }
  .bar { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.18); }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .src { font-size: 14px; color: rgba(255,255,255,.72); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; }
  .src b { color: var(--text); font-weight: 600; }
  .why { font-size: 14px; color: rgba(255,255,255,.72); margin: -4px 0 0; }
  .actions { display: flex; gap: 10px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px;
    padding: 0 18px; border-radius: 12px; background: var(--text); color: var(--bg); font-weight: 700;
    text-decoration: none; font-size: 15px; }
  .btn.ghost { background: var(--chip); color: var(--text); }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }
  .empty { height: 100%; display: grid; place-content: center; text-align: center; gap: 12px; padding: 24px; }
  .empty h2 { margin: 0; font-size: 22px; }
  .empty p { margin: 0; color: var(--muted); max-width: 32ch; }
  @media (min-width: 700px) { .card { padding-left: calc(50% - 280px); padding-right: calc(50% - 280px); }
    .stage { width: 100%; margin: 0; border-radius: 14px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header><nav class="chips" id="chips" aria-label="Topics"></nav></header>
<main id="feed" aria-live="polite"></main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("ss:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ss:" + k, JSON.stringify(v)); } catch {} },
};
const ICON = {
  muted: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  yt: '<svg viewBox="0 0 24 24"><path d="M10 15.5v-7l6 3.5-6 3.5zM21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4a2.5 2.5 0 0 0-1.8 1.8C2 8.8 2 12 2 12s0 3.2.4 4.8a2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8z"/></svg>',
};
const fmtTime = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const fmtViews = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e3 ? Math.round(n / 1e3) + "K" : String(n);

let topics = [], clips = [], seen = new Set(store.get("seen", []).map(String)), selected = store.get("selected", null);

async function load() {
  const [t, c] = await Promise.all([
    fetch("topics.json", { cache: "no-cache" }).then((r) => r.json()).catch(() => []),
    fetch("clips.json", { cache: "no-cache" }).then((r) => r.json()).catch(() => []),
  ]);
  topics = t.filter((x) => c.some((k) => k.topic === x.id));
  clips = c;
  bestOf = {};
  for (const k of clips) if (!bestOf[k.vid] || k.substance > bestOf[k.vid].substance) bestOf[k.vid] = k;
  const ids = topics.map((x) => x.id);
  selected = (selected || ids).filter((id) => ids.includes(id));
  if (!selected.length) selected = ids;
  renderChips(); renderFeed();
}

function isSeen(c) {
  if (seen.has(c.id)) return true;
  if (seen.has(c.vid) && c === bestOf[c.vid]) return true;   // old history: one clip per video
  for (const s of seen) {
    if (s.length > 12 && s.slice(0, 11) === c.vid && Math.abs(+s.slice(12) - c.start) < 90) return true;
  }
  return false;
}
let bestOf = {};   // video id -> its highest-scoring clip

// ---------- chips: "Mix" = every topic interleaved; tap a topic to focus it, tap more to mix them
function renderChips() {
  const all = selected.length === topics.length;
  const count = (id) => clips.filter((c) => c.topic === id && !isSeen(c)).length;
  $("#chips").innerHTML = (topics.length > 1 ? `<button class="chip" data-id="*" aria-pressed="${all}">Mix</button>` : "") +
    topics.map((t) => `<button class="chip" data-id="${esc(t.id)}" aria-pressed="${!all && selected.includes(t.id)}">
      ${esc(t.name)}<span class="n">${count(t.id)}</span></button>`).join("");
}
$("#chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  const id = b.dataset.id, all = selected.length === topics.length, ids = topics.map((t) => t.id);
  if (id === "*") selected = ids;
  else if (all) selected = [id];
  else if (selected.includes(id)) selected = selected.length === 1 ? ids : selected.filter((x) => x !== id);
  else selected = [...selected, id];
  store.set("selected", selected);
  renderChips(); renderFeed();
});

// ---------- feed: round-robin across selected topics, unseen first, best substance first
const GAP = 6;   // cards between two clips of the same video
function buildOrder() {
  const lanes = selected.map((id) => clips.filter((c) => c.topic === id && !isSeen(c))
    .sort((a, b) => b.substance - a.substance));
  const out = [];
  for (let i = 0; lanes.some((l) => l.length); i++) {
    const l = lanes[i % lanes.length]; if (!l.length) continue;
    const recent = new Set(out.slice(-GAP).map((c) => c.vid));
    const j = l.findIndex((c) => !recent.has(c.vid));
    out.push(l.splice(j < 0 ? 0 : j, 1)[0]);
  }
  return out;
}
// Unseen clips from the same video that are not right after this card.
const moreFrom = (i) => order.filter((c, k) => k > i + 1 && c.vid === order[i].vid);

let order = [];
const topicName = () => Object.fromEntries(topics.map((t) => [t.id, t.name]));
function cardHTML(c, i, name) {
  const more = moreFrom(i).length;
  return `
    <article class="card" data-i="${i}">
      <div class="bg" style="background-image:url('https://i.ytimg.com/vi/${esc(c.vid)}/hqdefault.jpg')"></div>
      <div class="meta-top"><span class="tag">${esc(name[c.topic])}</span><span>·</span><span>${fmtTime(c.end - c.start)}</span></div>
      <h2 class="hook">${esc(c.hook)}</h2>
      <div class="stage" style="background-image:url('https://i.ytimg.com/vi/${esc(c.vid)}/hqdefault.jpg')">
        <div class="slot"></div>
        <div class="poster" style="background-image:url('https://i.ytimg.com/vi/${esc(c.vid)}/hqdefault.jpg')"></div>
        <button class="tap" aria-label="Tap for sound or pause"><span class="paused-icon">${ICON.play}</span></button>
        <div class="pill">${ICON.muted}Tap for sound</div>
        <div class="bar"><i></i></div>
      </div>
      <div class="src"><b>${esc(c.channel)}</b> · ${esc(c.title)}</div>
      <p class="why">${esc(c.why)}</p>
      <div class="actions">
        <a class="btn" href="https://www.youtube.com/watch?v=${esc(c.vid)}&t=${c.start}s" target="_blank" rel="noopener">${ICON.yt}Watch full video</a>
        ${more ? `<button class="btn ghost more" data-i="${i}">More from this video · ${more}</button>` : ""}
      </div>
    </article>`;
}
const endCardHTML = () => `
    <div class="empty card"><h2>You're caught up</h2><p>${clips.filter(isSeen).length} clips watched. New clips land when the pipeline runs.</p>
      <button class="btn ghost" id="reset">Watch them again</button>
      <p style="font-size:12px">HN picks via <a href="https://hackertube.org">HackerTube</a> (ODC-By)</p></div>`;
function wireTail() {
  $("#reset").onclick = () => { seen.clear(); store.set("seen", []); renderChips(); renderFeed(); };
  document.querySelectorAll(".card[data-i]").forEach((el) => io.observe(el));
}

function renderFeed() {
  destroyPlayer();
  order = buildOrder();
  const feed = $("#feed");
  feed.scrollTop = 0;
  if (!clips.length) {
    feed.innerHTML = `<div class="empty"><h2>No clips yet</h2><p>Run the pipeline to fill the feed.</p></div>`;
    return;
  }
  const name = topicName();
  feed.innerHTML = order.map((c, i) => cardHTML(c, i, name)).join("") + endCardHTML();
  wireTail();
}

// "More from this video": move that video's next clip right after this card, and rebuild the cards below.
function playMore(i) {
  const next = moreFrom(i).sort((a, b) => a.start - b.start).find((c) => c.start > order[i].start) || moreFrom(i)[0];
  if (!next) return;
  order.splice(order.indexOf(next), 1);
  order.splice(i + 1, 0, next);
  for (const k of [...players.keys()]) if (k > i) dropPlayer(k);
  document.querySelectorAll(".card").forEach((el) => { if (!el.dataset.i || +el.dataset.i > i) { io.unobserve(el); el.remove(); } });
  const name = topicName();
  $("#feed").insertAdjacentHTML("beforeend", order.slice(i + 1).map((c, k) => cardHTML(c, i + 1 + k, name)).join("") + endCardHTML());
  const cur = cardAt(i).querySelector(".more");   // refresh this card's count
  if (cur) { const n = moreFrom(i).length; n ? (cur.textContent = `More from this video · ${n}`) : cur.remove(); }
  wireTail();
  if (activeIdx === i) ensurePlayer(i + 1);
  $("#feed").scrollTo({ top: cardAt(i + 1).offsetTop, behavior: "smooth" });
}
$("#feed").addEventListener("click", (e) => {
  const b = e.target.closest(".more"); if (b) playMore(+b.dataset.i);
});

// ---------- players: the visible clip plays; the next one is loaded in advance so a swipe starts instantly
const players = new Map();   // card index -> { player, ready }
let player = null, activeCard = null, activeIdx = -1, tick = null, seenTimer = null, blockedTimer = null;
const io = new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting && e.intersectionRatio > 0.6 && e.target !== activeCard) activate(e.target);
}, { root: document.getElementById("feed"), threshold: [0.6] });

const ytReady = new Promise((res) => {
  window.onYouTubeIframeAPIReady = res;
  const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
});

const cardAt = (i) => document.querySelector(`.card[data-i="${i}"]`);

function dropPlayer(i) {
  const p = players.get(i); if (!p) return;
  try { p.player.destroy(); } catch {}
  players.delete(i);
  const card = cardAt(i);
  if (card) { card.querySelector(".stage").classList.remove("sound", "paused", "playing"); card.querySelector(".slot").innerHTML = ""; }
}

function destroyPlayer() {   // used when the feed is rebuilt
  clearInterval(tick); clearTimeout(seenTimer); clearTimeout(blockedTimer);
  for (const i of [...players.keys()]) dropPlayer(i);
  player = null; activeCard = null; activeIdx = -1;
}

// Phones always allow a MUTED video to start by itself, but refuse sound until the person has tapped the
// page once. So every clip starts muted (it always plays), then sound is switched on right away once that is
// allowed. If the phone still refuses, the clip keeps playing muted with "Tap for sound".
let interacted = false, soundRefused = false;   // refused: stay muted until the next tap
const canSound = () => interacted || !!navigator.userActivation?.hasBeenActive;
function trySound(p, stage) {
  if (!canSound() || soundRefused || !p.isMuted()) return;
  p.unMute(); p.setVolume(100);
  setTimeout(() => {   // refused: the phone paused it. Go back to muted so it keeps playing.
    if (p.getPlayerState?.() !== YT.PlayerState.PLAYING) { soundRefused = true; p.mute(); p.playVideo(); }
    stage.classList.toggle("sound", !p.isMuted());
  }, 700);
}
function startPlayback(entry, c, stage) {
  const p = entry.player;
  p.mute(); p.seekTo(c.start, true); p.playVideo();
  clearTimeout(blockedTimer);
  blockedTimer = setTimeout(() => {   // still not playing: auto-play is blocked (e.g. Low Power Mode)
    if (players.get(activeIdx) === entry && p.getPlayerState?.() !== YT.PlayerState.PLAYING) stage.classList.add("paused");
  }, 2500);
}
// The first touch anywhere counts as the tap that allows sound.
for (const ev of ["pointerdown", "touchend", "keydown"]) addEventListener(ev, () => {
  if (interacted) return;
  interacted = true;
  const a = players.get(activeIdx);
  if (a?.ready && a.player.getPlayerState?.() === YT.PlayerState.PLAYING) trySound(a.player, activeCard.querySelector(".stage"));
}, { capture: true, passive: true });

function ensurePlayer(i) {
  if (players.has(i) || !order[i]) return players.get(i);
  const card = cardAt(i); if (!card) return;
  const c = order[i], stage = card.querySelector(".stage");
  const host = document.createElement("div"); host.className = "player";
  card.querySelector(".slot").appendChild(host);
  const entry = { player: null, ready: false };
  players.set(i, entry);
  entry.player = new YT.Player(host, {
    videoId: c.vid,
    playerVars: { start: c.start, end: c.end, autoplay: 0, mute: 1, playsinline: 1, controls: 0, rel: 0,
      modestbranding: 1, iv_load_policy: 3, disablekb: 1, fs: 0 },
    events: {
      onReady: () => { entry.ready = true; if (activeIdx === i) startPlayback(entry, c, stage); },
      onStateChange: (e) => {
        if (activeIdx !== i) { if (e.data === YT.PlayerState.PLAYING) e.target.pauseVideo(); return; }
        if (e.data === YT.PlayerState.ENDED) { advance(i); return; }
        if (e.data === YT.PlayerState.PLAYING) {
          stage.classList.remove("paused"); stage.classList.add("playing"); stage.classList.toggle("sound", !e.target.isMuted());
          trySound(e.target, stage);
        }
        if (e.data === YT.PlayerState.PAUSED) stage.classList.add("paused");
      },
    },
  });
  return entry;
}

async function activate(card) {
  await ytReady;
  const i = +card.dataset.i;
  const prev = players.get(activeIdx);
  if (prev?.ready) prev.player.pauseVideo();
  clearInterval(tick); clearTimeout(seenTimer);
  activeCard = card; activeIdx = i;
  for (const k of [...players.keys()]) if (k < i - 1 || k > i + 1) dropPlayer(k);   // keep memory low
  const entry = ensurePlayer(i);
  ensurePlayer(i + 1);                                                                 // preload the next clip
  player = entry.player;
  const c = order[i], stage = card.querySelector(".stage"), bar = card.querySelector(".bar i");
  if (entry.ready) startPlayback(entry, c, stage);
  tick = setInterval(() => {
    const t = player?.getCurrentTime?.(); if (t == null || activeIdx !== i) return;
    bar.style.width = Math.max(0, Math.min(100, ((t - c.start) / (c.end - c.start)) * 100)) + "%";
    if (t >= c.end - 0.25) advance(i);
  }, 250);
  seenTimer = setTimeout(() => markSeen(c), 4000);
}

function markSeen(c) { if (!seen.has(c.id)) { seen.add(c.id); store.set("seen", [...seen]); } }

// When a clip ends, glide to the next one (like Shorts' auto-scroll). The last clip loops instead.
let advancedFrom = -1;
function advance(i) {
  if (advancedFrom === i || activeIdx !== i) return;
  markSeen(order[i]);
  const next = cardAt(i + 1);
  if (!next) { player?.seekTo(order[i].start, true); return; }
  advancedFrom = i;
  $("#feed").scrollTo({ top: next.offsetTop, behavior: "smooth" });
  setTimeout(() => { if (advancedFrom === i) advancedFrom = -1; }, 1500);
}

$("#feed").addEventListener("click", (e) => {
  const tap = e.target.closest(".tap"); if (!tap || !player || !activeCard?.contains(tap)) return;
  const stage = tap.closest(".stage");
  interacted = true; soundRefused = false;
  if (player.isMuted()) { player.unMute(); player.setVolume(100); stage.classList.add("sound"); player.playVideo(); }
  else if (player.getPlayerState?.() !== YT.PlayerState.PLAYING) player.playVideo();
  else player.pauseVideo();
});
document.addEventListener("visibilitychange", () => { if (document.hidden) player?.pauseVideo?.(); });
document.addEventListener("keydown", (e) => {
  const feed = $("#feed");
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); feed.scrollBy({ top: innerHeight, behavior: "smooth" }); }
  if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); feed.scrollBy({ top: -innerHeight, behavior: "smooth" }); }
  if (e.key === " " || e.key === "m") { e.preventDefault(); activeCard?.querySelector(".tap").click(); }
});

load();
</script>
</body>
</html>
