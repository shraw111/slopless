<style>
  :root {
    --bg: #0b0b0c; --card: #121214; --text: #f4f4f2; --muted: #9a9a96; --line: rgba(255,255,255,.12);

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  a { color: inherit; }

  /* topic chips */
  header { position: fixed; z-index: 20; inset: 0 0 auto 0; padding: env(safe-area-inset-top) 0 0;

  .new { padding: 2px 7px; border-radius: 6px; background: var(--accent); color: var(--accent-text);

  .chip svg { width: 18px; height: 18px; fill: currentColor; display: block; }
  .chip.hist { padding: 7px 11px; }
  .pill-btn { display: inline-flex; align-items: center; gap: 6px; }
  .pill-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .pill-btn.save[aria-pressed="true"] { color: var(--accent); }
  .fs { position: absolute; z-index: 3; top: 8px; left: 8px; width: 34px; height: 34px; border-radius: 50%;

  /* Full screen: the clip's video fills the screen; text, buttons and chips step aside.

  body.immersive .card[data-i] { display: block; padding: 0; max-width: none; background: #000; }

    header, #mode, #recall-pill, #keys { display: none; }

    .card[data-i] > :not(.stage) { display: none; }
    .card[data-i] > .stage { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;

    .stage .poster { background-size: contain; }

  .burst { position: absolute; z-index: 4; left: 50%; top: 50%; width: 90px; height: 90px; margin: -45px 0 0 -45px;
    color: var(--accent); opacity: 0; pointer-events: none; }
  .burst svg { width: 100%; height: 100%; fill: currentColor; filter: drop-shadow(0 4px 14px rgba(0,0,0,.5)); }
  .burst.go { animation: burst .8s ease-out; }

  .h-tabs { display: flex; gap: 8px; margin-bottom: 14px; }

  .h-tabs button[aria-pressed="true"] { background: var(--text); color: var(--bg); }

  .h-meta { display: grid; gap: 3px; min-width: 0; }
  .h-meta b { font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .h-meta span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .h-restore { min-height: 36px; padding: 0 12px; font-size: 13px; }

  .h-clear { margin-top: 20px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px;
    padding: 0 18px; border-radius: 12px; background: var(--text); color: var(--bg); font-weight: 700;
    text-decoration: none; font-size: 15px; }
  .btn.ghost { background: var(--chip); color: var(--text); }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }
  .empty { height: 100%; display: grid; place-content: center; text-align: center; gap: 12px; padding: 24px; }

  @media (min-width: 700px) { .card { padding-left: calc(50% - 280px); padding-right: calc(50% - 280px); }

  /* Desktop: video on the left, everything to read on the right, key points open, shortcuts shown */

<body>
<header><nav class="chips" id="chips" aria-label="Topics"></nav></header>
<main id="feed" aria-live="polite"></main>
<div id="swipe-hint" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg><span>Remove video</span></div>
<div id="mode" hidden></div>
<section id="history" hidden aria-label="History"></section>
<section id="search" class="panel" hidden aria-label="Search"></section>
<section id="sheet" hidden></section>
<button id="recall-pill" hidden></button>
<div id="keys" aria-hidden="true">↑ ↓ next · Space pause · M sound · F full screen · S save · X remove · / search · B browse · R recall</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  get(k, d) { try { const v = localStorage.getItem("ss:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ss:" + k, JSON.stringify(v)); } catch {} },
};
const ICON = {
  expand: '<svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"/></svg>',
  shrink: '<svg viewBox="0 0 24 24"><path d="M8 4h2v6H4V8h4V4zm6 0h2v4h4v2h-6V4zM4 14h6v6H8v-4H4v-2zm10 0h6v2h-4v4h-2v-6z"/></svg>',
  grid: '<svg viewBox="0 0 24 24"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg>',
  flag: '<svg viewBox="0 0 24 24"><path d="M5 3h2v18H5V3zm3 1h10l-2 4 2 4H8V4z"/></svg>',
  brain: '<svg viewBox="0 0 24 24"><path d="M9 3a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 3 3 3 3 0 0 0 3-1V4a3 3 0 0 0-3-1zm6 0a3 3 0 0 0-3 1v15a3 3 0 0 0 3 1 3 3 0 0 0 3-3 3 3 0 0 0 2-5 3 3 0 0 0-2-5 3 3 0 0 0-3-3z"/></svg>',

  const hint = $("#swipe-hint"), armed = drag.dx < -innerWidth * 0.28;

}, { passive: true });
$("#feed").addEventListener("touchend", () => {

    d.card.classList.add("springback"); d.card.style.transform = ""; d.card.style.opacity = "";
    hint.style.transition = "opacity .25s, transform .18s, color .18s"; hint.style.opacity = "0"; hint.classList.remove("armed");

});

function removeVideo(card) {
  const c = order[+card.dataset.i]; if (!c) return;
  removed.add(c.vid); store.set("removed", [...removed]);
  logHistory(c, "removed");
  animateOut(card, (x) => x.vid === c.vid, () => toast("Removed from your feed", "Undo", () => restoreVideo(c.vid, c.id)));
}
function animateOut(card, match, after) {
  if (activeCard === card) { clearInterval(tick); watchedClip = null; }
  const hint = $("#swipe-hint");
  card.classList.remove("springback"); card.classList.add("leaving");
  card.style.transform = "translateX(-125%) rotate(-14deg)"; card.style.opacity = "0";
  setTimeout(() => {
    hint.style.transition = "opacity .3s"; hint.style.opacity = "0"; hint.classList.remove("armed");
    setTimeout(() => (hint.style.transition = ""), 320);
    const feed = $("#feed");
    document.querySelectorAll(".card[data-i]").forEach((el) => {
      const k = +el.dataset.i;
      if (order[k] && match(order[k])) { dropPlayer(k); io.unobserve(el); el.remove(); }
    });
    if (activeCard && !activeCard.isConnected) { activeCard = null; activeIdx = -1; player = null; }
    const now = [...document.querySelectorAll(".card")].find((el) => Math.abs(el.offsetTop - feed.scrollTop) < feed.clientHeight / 2);
    if (now?.dataset.i) {
      now.classList.add("entering");

}
function restoreVideo(vid, focusId) {

  renderChips();
  if (historyOpen) { renderHistory(); return; }

let toastTimer = null;

// ---------- History: what you watched (tap to replay) and what you removed (restore)

const ago = (t) => { const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
function openHistory() {

}

}
function renderHistory() {
  const flagged = Object.entries(flags).map(([id, f]) => ({ ...(f.snap || { id }), id, at: f.at, reason: f.reason, sent: f.sent }))
    .sort((a, b) => b.at - a.at);
  const list = historyTab === "saved" ? saved : historyTab === "flagged" ? flagged : history.filter((h) => h.kind === historyTab);

    <div class="h-tabs">

    </div>

      <li class="h-item" data-id="${esc(h.id)}" data-vid="${esc(h.vid)}">

        ${historyTab === "removed" ? `<button class="btn ghost h-restore">Restore</button>` : ""}
        ${historyTab === "saved" ? `<button class="btn ghost h-unsave">Unsave</button>` : ""}

$("#history").addEventListener("click", (e) => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { historyTab = tab.dataset.tab; renderHistory(); return; }
  const item = e.target.closest(".h-item");
  if (e.target.closest(".h-restore") && item) { restoreVideo(item.dataset.vid, item.dataset.id); toast("Back in your feed"); return; }
  if (e.target.closest(".h-unsave") && item) { unsave(item.dataset.id); renderHistory(); return; }
  if (e.target.closest(".h-unflag") && item) { delete flags[item.dataset.id]; store.set("flags", flags); renderHistory(); renderChips(); return; }
  if (e.target.closest(".export-saved")) { exportSaved(); return; }
  if (e.target.closest(".send-flags")) { sendFlags(); return; }
  if (e.target.closest(".h-recall")) { openRecall(); return; }
  if (e.target.closest(".play-saved")) {   // your saved clips, newest first, as their own swipe feed
    const list = saved.map(findClip).filter(Boolean);
    if (!list.length) { toast("Those clips are no longer in the feed"); return; }
    closeHistory(); renderChips(); renderFeed(list, `Saved · ${list.length}`); return;
  }
  if (e.target.closest(".h-clear")) {
    if (!confirm("Clear your watch history? Watched clips will show up in the feed again.")) return;
    history = history.filter((h) => h.kind !== "watched"); store.set("history", history);
    seen.clear(); store.set("seen", []); renderHistory(); renderChips(); return;
  }
  if (item && historyTab !== "removed" && historyTab !== "flagged") {   // replay: this clip first, then the normal feed
    const h = (historyTab === "saved" ? saved : history).find((x) => x.id === item.dataset.id);
    closeHistory(); renderChips();
    playFirst(h);
  }
});

// Put one clip at the top of the feed (from History, Saved, Search or a shared link).
function findClip(ref) {
  return clips.find((x) => x.id === ref.id) ||
         clips.find((x) => x.vid === ref.vid && Math.abs(x.start - (ref.start ?? -999)) < 90);
}
function playFirst(ref) {
  const c = findClip(ref);
  if (!c) { if (ref.vid) open(`https://www.youtube.com/watch?v=${ref.vid}&t=${ref.start || 0}s`, "_blank", "noopener"); return false; }
  renderFeed([c, ...buildOrder().filter((x) => x.id !== c.id)]);
  return true;
}

// ---------- Save (button or double-tap on the video)
const snapshot = (c) => ({ id: c.id, vid: c.vid, hook: c.hook, title: c.title, channel: c.channel, topic: c.topic,
                           start: c.start, end: c.end, at: Date.now() });

  });
}
function save(c) { if (isSaved(c)) return; saved = [snapshot(c), ...saved]; store.set("saved", saved); setSaveButtons(c); }
function unsave(id) {

  else { save(c); toast("Saved · find it in History", "View", () => { historyTab = "saved"; openHistory(); }); }
}

// ---------- Share: a link that opens the feed on this exact clip
async function shareClip(c) {

  try {
    if (navigator.share) { await navigator.share({ title: c.hook, text: `${c.hook} (${c.channel})`, url }); return; }

// ---------- Full screen: the video fills the screen and swiping still moves between clips.
// Android / computers: real full screen (and landscape on phones). iPhone can't do that from a web page,
// so it gets the same edge-to-edge layout, plus a hint to turn the phone sideways.
async function toggleImmersive(on = !document.body.classList.contains("immersive")) {
  const card = activeCard;

  document.querySelectorAll(".fs").forEach((b) => (b.innerHTML = on ? ICON.shrink : ICON.expand));
  try {
    if (on && document.fullscreenEnabled && !document.fullscreenElement) {
      await document.documentElement.requestFullscreen({ navigationUI: "hide" });
      await screen.orientation?.lock?.("landscape").catch(() => {});
    } else if (!on && document.fullscreenElement) {
      screen.orientation?.unlock?.(); await document.exitFullscreen();
    }
  } catch {}
  if (on && !document.fullscreenEnabled && matchMedia("(orientation: portrait)").matches) toast("Turn your phone sideways for full screen");
  if (card) requestAnimationFrame(() => $("#feed").scrollTo({ top: card.offsetTop }));   // stay on the same clip
}

// ---------- Sheet: one full-screen panel used by Browse, channel pages and Recall

const itemHTML = (c) => `

// ---------- Browse: every clip, by topic and subject
function openBrowse() {
  const name = topicName();
  sheetLists = {};
  const sections = topics.map((t) => {
    const groups = new Map();
    for (const c of clips) if (c.topic === t.id && !removed.has(c.vid)) {
      const g = c.subject || "other"; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(c);
    }
    const sorted = [...groups].sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
    return `<h3 class="b-topic">${esc(name[t.id])}</h3>` + sorted.map(([g, list]) => {
      const key = `${t.id}::${g}`; sheetLists[key] = list.sort((a, b) => b.substance - a.substance);
      return `<section class="b-group">
        <button class="b-head play-list" data-list="${esc(key)}"><span>${esc(g)}</span><span class="n">${list.length} ▶</span></button>
        <div class="b-row">${list.map((c) => `

// ---------- Export saved clips as notes (paste into Notes, Notion, Obsidian…)
function savedAsNotes() {

// ---------- Bad cut: hide the clip now; send flags to the pipeline as a GitHub issue to re-cut them
const REASONS = ["Starts mid-sentence", "Cuts off the point", "Not worth a minute"];
function askBadCut(card) {
  const c = order[+card.dataset.i]; if (!c) return;
  const row = card.querySelector(".actions");
  row.querySelector(".flag-menu")?.remove();
  row.insertAdjacentHTML("beforeend", `<div class="flag-menu">${REASONS.map((r) => `<button data-r="${esc(r)}">${esc(r)}</button>`).join("")}
    <button data-r="">Cancel</button></div>`);
  row.querySelector(".flag-menu").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    e.stopPropagation(); row.querySelector(".flag-menu").remove();
    if (!b.dataset.r) return;
    flags[c.id] = { reason: b.dataset.r, at: Date.now(), sent: false, snap: snapshot(c) }; store.set("flags", flags);
    animateOut(card, (x) => x.id === c.id, () => toast("Thanks, hidden. Send flags from History", "Undo", () => {
      delete flags[c.id]; store.set("flags", flags); renderChips(); renderFeed(); }));
  });
}
function sendFlags() {
  const open_ = Object.entries(flags).filter(([, f]) => !f.sent);
  if (!open_.length) { toast("Nothing new to send"); return; }
  const body = "Bad cuts flagged in the Signal Shorts feed. Claude: run `flags-apply` on this and re-cut them.\n\n```json\n" +
    JSON.stringify({ flags: open_.map(([id, f]) => ({ id, reason: f.reason, hook: f.snap?.hook })) }, null, 1) + "\n```\n";
  open(`https://github.com/shraw111/slopless/issues/new?title=${encodeURIComponent(`Bad cuts (${open_.length})`)}&body=${encodeURIComponent(body)}`, "_blank", "noopener");

  store.set("flags", flags); renderHistory();

// ---------- Daily recall: 3 clips you saved or watched come back as a question (spaced repetition)
const DAYS = [1, 3, 7, 14, 30];
const today = () => new Date().toISOString().slice(0, 10);
function recallQueue() {
  const pool = [...saved, ...history.filter((h) => h.kind === "watched")].map(findClip)
    .filter((c, k, a) => c && c.quiz && a.findIndex((x) => x && x.id === c.id) === k);
  const savedIds = new Set(saved.map((s) => s.id));
  return pool.filter((c) => (recall[c.id]?.due || 0) <= Date.now())
    .sort((a, b) => (savedIds.has(b.id) - savedIds.has(a.id)) || ((recall[a.id]?.due || 0) - (recall[b.id]?.due || 0)))
    .slice(0, 3);
}
let rq = [], rqi = 0;
function openRecall() {
  rq = recallQueue(); rqi = 0;
  if (!rq.length) {
    openSheet("recall", "Daily recall", `<p class="h-empty">${clips.some((c) => c.quiz) ? "Nothing due. Watch or save a few clips with summaries, and they'll come back here as questions." : "No recall questions yet."}</p>`);
    return;
  }
  openSheet("recall", "Daily recall", `<div id="rq"></div>`); showQuestion();
}
function showQuestion() {
  const box = $("#rq");
  if (rqi >= rq.length) {
    store.set("recallDay", today()); $("#recall-pill").hidden = true;
    box.innerHTML = `<div class="rq-done"><h3>Done for today ✓</h3><p class="h-empty">Ideas you missed come back tomorrow; the ones you knew come back later and later.</p>
      <button class="btn sheet-close">Back to the feed</button></div>`; return;
  }
  const c = rq[rqi];
  box.innerHTML = `<p class="stats">Question ${rqi + 1} of ${rq.length}</p>
    <h3 class="rq-q">${esc(c.quiz.q)}</h3>
    <button class="btn rq-show">Show answer</button>
    <div class="rq-a" hidden>
      <p>${esc(c.quiz.a)}</p>
      <p class="rq-src">From <b>${esc(c.hook)}</b> · ${esc(c.channel)} <button class="rq-watch" data-id="${esc(c.id)}">Rewatch ▶</button></p>
      <div class="rq-grade"><button class="btn ghost" data-g="0">Not quite</button><button class="btn" data-g="1">I knew it</button></div>
    </div>`;
}
function gradeRecall(knew) {
  const c = rq[rqi], r = recall[c.id] || { box: 0 };
  r.box = knew ? Math.min(r.box + 1, DAYS.length - 1) : 0;
  r.due = Date.now() + DAYS[knew ? r.box : 0] * 864e5;
  recall[c.id] = r; store.set("recall", recall);
  rqi++; showQuestion();
}
function updateRecallPill() {
  const due = store.get("recallDay", "") !== today() && recallQueue().length > 0;
  $("#recall-pill").hidden = !due;
  if (due) $("#recall-pill").innerHTML = `${ICON.brain}Recall · ${recallQueue().length}`;
}
$("#recall-pill").addEventListener("click", openRecall);

$("#sheet").addEventListener("click", (e) => {
  if (e.target.closest(".sheet-x") || e.target.closest(".sheet-close")) { closeSheet(); return; }
  const pl = e.target.closest(".play-list");
  if (pl) { const list = sheetLists[pl.dataset.list]; const t = pl.dataset.list === "all" ? $("#sheet h2").textContent : pl.querySelector("span").textContent;
            closeSheet(); renderFeed(list, `${t} · ${list.length}`); return; }
  const it = e.target.closest(".h-item, .b-tile, .rq-watch");
  if (it) { closeSheet(); playFirst({ id: it.dataset.id }); return; }
  if (e.target.closest(".rq-show")) { e.target.closest(".rq-show").hidden = true; $(".rq-a").hidden = false; return; }
  const g = e.target.closest("[data-g]"); if (g) gradeRecall(g.dataset.g === "1");
});

// ---------- Search: hooks, summaries, key points, titles, channels and subjects
let searchOpen = false;
function openSearch() {
  if (historyOpen) closeHistory(false);
  if (sheetOpen) closeSheet(false);
  searchOpen = true; player?.pauseVideo?.();
  const s = $("#search"); s.hidden = false;
  s.innerHTML = `<input id="q" type="search" placeholder="Search clips: RAG, Karpathy, pricing…" autocomplete="off" enterkeyhint="search">
    <ul class="h-list" id="results"></ul>`;

function closeSearch(rerender = true) { searchOpen = false; $("#search").hidden = true; if (rerender) renderChips(); }
function runSearch() {
  const terms = $("#q").value.toLowerCase().split(/\s+/).filter(Boolean);
  const name = topicName();
  const hay = (c) => [c.hook, c.summary, ...(c.points || []), c.title, c.channel, c.subject, name[c.topic]].join(" ").toLowerCase();
  const hits = terms.length ? clips.filter((c) => !removed.has(c.vid) && terms.every((t) => hay(c).includes(t)))
    .sort((a, b) => b.substance - a.substance).slice(0, 60) : [];
  $("#results").innerHTML = !terms.length ? `<p class="h-empty">Search every clip by what's said in it, its title or its channel.</p>`
    : hits.length ? hits.map((c) => `
      <li class="h-item" data-id="${esc(c.id)}">
        <img src="https://i.ytimg.com/vi/${esc(c.vid)}/mqdefault.jpg" alt="" loading="lazy">
        <div class="h-meta"><b>${esc(c.hook)}</b><span>${esc(c.channel)}${isSeen(c) ? " · watched" : ""}</span></div>
      </li>`).join("") : `<p class="h-empty">No clips match “${esc(terms.join(" "))}”.</p>`;
}
$("#search").addEventListener("click", (e) => {
  const item = e.target.closest(".h-item"); if (!item) return;
  closeSearch(); playFirst({ id: item.dataset.id });
});

let lastTap = 0, tapTimer = null;
$("#feed").addEventListener("click", (e) => {
  const card = e.target.closest(".card[data-i]"), c = card && order[+card.dataset.i];
  if (e.target.closest(".save") && c) { toggleSave(c); return; }
  if (e.target.closest(".share") && c) { shareClip(c); return; }
  if (e.target.closest(".flag") && card) { askBadCut(card); return; }
  const ch = e.target.closest(".ch"); if (ch) { openChannel(ch.dataset.ch); return; }
  if (e.target.closest(".fs")) { toggleImmersive(); return; }
  if (e.target.closest(".speed")) {
    rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length]; store.set("rate", rate);
    document.querySelectorAll(".speed").forEach((b) => (b.textContent = `${rate}×`));
    for (const { player: pl, ready } of players.values()) if (ready) pl.setPlaybackRate?.(rate);
    return;
  }
  const tap = e.target.closest(".tap"); if (!tap || !player || !activeCard?.contains(tap)) return;
  const stage = tap.closest(".stage"), now = Date.now();
  if (now - lastTap < 300) {   // double-tap: save, with a heart
    clearTimeout(tapTimer); lastTap = 0;
    if (c && !isSaved(c)) { save(c); toast("Saved · find it in History", "View", () => { historyTab = "saved"; openHistory(); }); }
    const h = stage.querySelector(".burst"); h.classList.remove("go"); void h.offsetWidth; h.classList.add("go");
    return;
  }
  lastTap = now;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => {   // single tap: sound on, or pause / play
    interacted = true; soundRefused = false;
    if (player.isMuted()) { player.unMute(); player.setVolume(100); stage.classList.add("sound"); player.playVideo(); }
    else if (player.getPlayerState?.() !== YT.PlayerState.PLAYING) player.playVideo();
    else player.pauseVideo();
  }, 260);
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) return;
  player?.pauseVideo?.();
  store.set("watchLog", watchLog);
  const c = watchedClip; if (c && watched >= (c.end - c.start) * 0.5) markSeen(c);   // leaving the app: no skip
});
document.addEventListener("keydown", (e) => {
  if (searchOpen || e.target.closest?.("input")) { if (e.key === "Escape") closeSearch(); return; }
  if (e.key === "Escape") { if (sheetOpen) closeSheet(); if (historyOpen) closeHistory(); return; }
  if (e.key === "/") { e.preventDefault(); openSearch(); return; }
  if (e.key === "b") { openBrowse(); return; }
  if (e.key === "f") { toggleImmersive(); return; }
  if (e.key === "r") { openRecall(); return; }
  const feed = $("#feed");
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); feed.scrollBy({ top: innerHeight, behavior: "smooth" }); }
  if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); feed.scrollBy({ top: -innerHeight, behavior: "smooth" }); }
  if (e.key === " " || e.key === "m") { e.preventDefault(); activeCard?.querySelector(".tap").click(); }
  if (e.key === "x" && activeCard) removeVideo(activeCard);
  if (e.key === "s" && activeCard) toggleSave(order[activeIdx]);
});

load();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
