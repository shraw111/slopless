<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Signal Shorts</title>
<meta name="description" content="The best 60–90 seconds from genuinely good long-form videos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b0c'/%3E%3Cpath d='M6 20h4l3-9 4 13 3-8h6' fill='none' stroke='%23e8ff6b' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0b0c; --card: #121214; --text: #f4f4f2; --muted: #9a9a96; --line: rgba(255,255,255,.12);
    --accent: #e8ff6b; --accent-text: #0b0b0c; --chip: rgba(255,255,255,.08);
    --top: calc(env(safe-area-inset-top) + 56px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 15px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  a { color: inherit; }

  /* topic chips */
  header { position: fixed; z-index: 20; inset: 0 0 auto 0; padding: env(safe-area-inset-top) 0 0;
    background: linear-gradient(rgba(0,0,0,.55), transparent); pointer-events: none; }
  header .chips { pointer-events: auto; }
  .chips { display: flex; gap: 8px; padding: 10px 16px 14px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.14);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--text);
    font-size: 14px; font-weight: 600; white-space: nowrap; transition: background .15s, color .15s; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  .chip .n { opacity: .55; font-weight: 500; margin-left: 4px; }

  /* feed */
  /* A fixed full-screen layer: the browser's address bar never resizes cards mid-swipe. */
  #feed { position: fixed; inset: 0; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain;
    scrollbar-width: none; }
  #feed::-webkit-scrollbar { display: none; }
  .card { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
    padding: var(--top) 16px calc(env(safe-area-inset-bottom) + 20px); }
  .card > * { position: relative; z-index: 1; }
  /* Shorts-style backdrop: the video's own thumbnail, blurred, fills the screen */
  .card > .bg { position: absolute; z-index: 0; inset: -40px; background: #000 center / cover no-repeat;
    filter: blur(28px) brightness(.38) saturate(1.3); }
  .meta-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .tag { color: var(--accent); font-weight: 700; letter-spacing: .02em; text-transform: uppercase; font-size: 12px; }
  .hook { margin: 0; font-size: clamp(22px, 6.4vw, 30px); line-height: 1.15; font-weight: 750;
    letter-spacing: -.02em; text-wrap: balance; }
  .stage { position: relative; width: calc(100% + 32px); margin: 0 -16px; aspect-ratio: 16 / 9; overflow: hidden;
    background: #000 center / cover no-repeat; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .stage iframe, .stage .player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* thumbnail stays on top until the video is really playing, so there is no black flash */
  .poster { position: absolute; inset: 0; z-index: 1; background: #000 center / cover no-repeat;
    transition: opacity .35s; pointer-events: none; }
  .stage.playing .poster { opacity: 0; }
  .tap { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; }
  .pill { position: absolute; z-index: 3; left: 10px; bottom: 12px; display: flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 999px; background: rgba(0,0,0,.66); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); font-size: 13px; font-weight: 600; pointer-events: none;
    transition: opacity .3s; }
  .pill svg { width: 16px; height: 16px; fill: currentColor; }
  .stage.sound .pill { opacity: 0; }
  .paused-icon { width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,.55); display: none;
    place-items: center; }
  .paused-icon svg { width: 28px; height: 28px; fill: #fff; margin-left: 4px; }
  .stage.paused .paused-icon { display: grid; }
  .bar { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.18); }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .src { font-size: 14px; color: rgba(255,255,255,.72); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; }
  .src b { color: var(--text); font-weight: 600; }
  .why { font-size: 14px; color: rgba(255,255,255,.72); margin: -4px 0 0; }
  /* summary from the transcript: 3 lines, tap to open the key points */
  .sum { display: block; text-align: left; font-size: 14.5px; line-height: 1.45; color: rgba(255,255,255,.86);
    margin: -4px 0 0; }
  .sum-text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .sum .points { display: none; margin: 8px 0 0; padding-left: 18px; color: rgba(255,255,255,.78); }
  .sum .points li { margin: 3px 0; }
  .sum-more { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--accent); }
  .sum[aria-expanded="true"] .sum-text { -webkit-line-clamp: unset; }
  .sum[aria-expanded="true"] .points { display: block; }
  .sum[aria-expanded="true"] .sum-more { display: none; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .title-link { color: inherit; text-decoration: underline; text-decoration-color: rgba(255,255,255,.35);
    text-underline-offset: 3px; }
  .title-link:active, .title-link:hover { color: var(--text); text-decoration-color: currentColor; }
  .pill-btn { padding: 7px 13px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: 13px; font-weight: 600; }
  .card[data-i] { touch-action: pan-y; transform-origin: 50% 85%; }
  /* swipe-to-remove: a label waits behind the feed and shows through as the card moves away */
  #feed { z-index: 1; }
  #swipe-hint { position: fixed; z-index: 0; top: 50%; right: 22px; transform: translateY(-50%) scale(.85);
    display: grid; justify-items: center; gap: 8px; color: rgba(255,255,255,.6); font-weight: 700; font-size: 13px;
    opacity: 0; transition: transform .18s, color .18s; pointer-events: none; }
  #swipe-hint svg { width: 30px; height: 30px; fill: currentColor; }
  #swipe-hint.armed { color: var(--accent); transform: translateY(-50%) scale(1.08); }
  .card.leaving { transition: transform .32s cubic-bezier(.5,0,.75,0), opacity .32s; }
  .card.springback { transition: transform .38s cubic-bezier(.2,1.5,.4,1), opacity .25s; }
  .card.entering { animation: enter .42s cubic-bezier(.2,.9,.3,1); }
  @keyframes enter { from { opacity: 0; transform: scale(.94) translateY(14px); } to { opacity: 1; transform: none; } }   /* vertical swipes scroll; horizontal ones are ours */
  .chip.hist { margin-left: auto; }
  .chip.hist[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  #toast { position: fixed; z-index: 40; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px);
    transform: translate(-50%, 140%); display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 16px;
    border-radius: 999px; background: #f4f4f2; color: #0b0b0c; font-weight: 600; font-size: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); transition: transform .25s, opacity .25s; white-space: nowrap;
    opacity: 0; pointer-events: none; }
  #toast.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  #toast button { color: #0b0b0c; background: var(--accent); padding: 6px 12px; border-radius: 999px; font-weight: 700; }
  #history { position: fixed; z-index: 15; inset: 0; overflow-y: auto; background: var(--bg);
    padding: calc(var(--top) + 4px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  #history[hidden] { display: none; }
  .h-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .h-tabs button { padding: 8px 14px; border-radius: 10px; background: var(--chip); font-weight: 600; font-size: 14px; }
  .h-tabs button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .h-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .h-item { display: grid; grid-template-columns: 120px 1fr auto; gap: 12px; align-items: center; cursor: pointer; }
  .h-item img { width: 120px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; background: #222; }
  .h-meta { display: grid; gap: 3px; min-width: 0; }
  .h-meta b { font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .h-meta span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .h-restore { min-height: 36px; padding: 0 12px; font-size: 13px; }
  .h-empty { color: var(--muted); max-width: 34ch; }
  .h-clear { margin-top: 20px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px;
    padding: 0 18px; border-radius: 12px; background: var(--text); color: var(--bg); font-weight: 700;
    text-decoration: none; font-size: 15px; }
  .btn.ghost { background: var(--chip); color: var(--text); }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }
  .empty { height: 100%; display: grid; place-content: center; text-align: center; gap: 12px; padding: 24px; }
  .empty h2 { margin: 0; font-size: 22px; }
  .empty p { margin: 0; color: var(--muted); max-width: 32ch; }
  @media (min-width: 700px) { .card { padding-left: calc(50% - 280px); padding-right: calc(50% - 280px); }
    .stage { width: 100%; margin: 0; border-radius: 14px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header><nav class="chips" id="chips" aria-label="Topics"></nav></header>
<main id="feed" aria-live="polite"></main>
<div id="swipe-hint" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg><span>Remove video</span></div>
<section id="history" hidden aria-label="History"></section>
<div id="toast" role="status"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("ss:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ss:" + k, JSON.stringify(v)); } catch {} },
};
const ICON = {
  muted: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  yt: '<svg viewBox="0 0 24 24"><path d="M10 15.5v-7l6 3.5-6 3.5zM21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4a2.5 2.5 0 0 0-1.8 1.8C2 8.8 2 12 2 12s0 3.2.4 4.8a2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8z"/></svg>',
};
const fmtTime = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const fmtViews = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e3 ? Math.round(n / 1e3) + "K" : String(n);

let topics = [], clips = [], seen = new Set(store.get("seen", []).map(String)), selected = store.get("selected", null);

async function load() {
  const [t, c] = await Promise.all([
    fetch("topics.json", { cache: "no-cache" }).then((r) => r.json()).catch(() => []),
    fetch("clips.json", { cache: "no-cache" }).then((r) => r.json()).catch(() => []),
  ]);
  topics = t.filter((x) => c.some((k) => k.topic === x.id));
  clips = c;
  bestOf = {};
  for (const k of clips) if (!bestOf[k.vid] || k.substance > bestOf[k.vid].substance) bestOf[k.vid] = k;
  const ids = topics.map((x) => x.id);
  selected = (selected || ids).filter((id) => ids.includes(id));
  if (!selected.length) selected = ids;
  renderChips(); renderFeed();
}

function isSeen(c) {
  if (seen.has(c.id)) return true;
  if (seen.has(c.vid) && c === bestOf[c.vid]) return true;   // old history: one clip per video
  for (const s of seen) {
    if (s.length > 12 && s.slice(0, 11) === c.vid && Math.abs(+s.slice(12) - c.start) < 90) return true;
  }
  return false;
}
let bestOf = {};   // video id -> its highest-scoring clip
let skips = store.get("skips", {});                // clip id -> times swiped away early
let removed = new Set(store.get("removed", []));   // video ids removed with a left swipe
let history = store.get("history", []);            // newest first: watched and removed clips
const SKIP_LIMIT = 2;                              // swiped away early twice: gone
const available = (c) => !isSeen(c) && !removed.has(c.vid) && (skips[c.id] || 0) < SKIP_LIMIT;

function logHistory(c, kind) {
  history = [{ kind, id: c.id, vid: c.vid, hook: c.hook, title: c.title, channel: c.channel, topic: c.topic,
               start: c.start, end: c.end, at: Date.now() },
             ...history.filter((h) => !(h.id === c.id && h.kind === kind))].slice(0, 300);
  store.set("history", history);
}

// ---------- chips: "Mix" = every topic interleaved; tap a topic to focus it, tap more to mix them
function renderChips() {
  const all = selected.length === topics.length && !historyOpen;
  const count = (id) => clips.filter((c) => c.topic === id && available(c)).length;
  $("#chips").innerHTML = (topics.length > 1 ? `<button class="chip" data-id="*" aria-pressed="${all}">Mix</button>` : "") +
    topics.map((t) => `<button class="chip" data-id="${esc(t.id)}" aria-pressed="${!historyOpen && !all && selected.includes(t.id) && selected.length < topics.length}">
      ${esc(t.name)}<span class="n">${count(t.id)}</span></button>`).join("") +
    `<button class="chip hist" data-id="history" aria-pressed="${historyOpen}">History</button>`;
}
$("#chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  if (b.dataset.id === "history") { historyOpen ? closeHistory() : openHistory(); return; }
  if (historyOpen) closeHistory(false);
  const id = b.dataset.id, all = selected.length === topics.length, ids = topics.map((t) => t.id);
  if (id === "*") selected = ids;
  else if (all) selected = [id];
  else if (selected.includes(id)) selected = selected.length === 1 ? ids : selected.filter((x) => x !== id);
  else selected = [...selected, id];
  store.set("selected", selected);
  renderChips(); renderFeed();
});

// ---------- feed: round-robin across selected topics, unseen first, best substance first
const GAP = 6;   // cards between two clips of the same video
function buildOrder() {
  const ok = clips.filter(available);
  return interleave(ok.filter((c) => !skips[c.id])).concat(interleave(ok.filter((c) => skips[c.id])));
}
function interleave(list) {
  const lanes = selected.map((id) => list.filter((c) => c.topic === id).sort((a, b) => b.substance - a.substance));
  const out = [];
  for (let i = 0; lanes.some((l) => l.length); i++) {
    const l = lanes[i % lanes.length]; if (!l.length) continue;
    const recent = new Set(out.slice(-GAP).map((c) => c.vid));
    const j = l.findIndex((c) => !recent.has(c.vid));
    out.push(l.splice(j < 0 ? 0 : j, 1)[0]);
  }
  return out;
}
// Unseen clips from the same video that are not right after this card.
const moreFrom = (i) => order.filter((c, k) => k > i + 1 && c.vid === order[i].vid);

let order = [];
const topicName = () => Object.fromEntries(topics.map((t) => [t.id, t.name]));
function cardHTML(c, i, name) {
  const more = moreFrom(i).length;
  return `
    <article class="card" data-i="${i}">
      <div class="bg" style="background-image:url('https://i.ytimg.com/vi/${esc(c.vid)}/hqdefault.jpg')"></div>
      <div class="meta-top"><span class="tag">${esc(name[c.topic])}</span><span>·</span><span>${fmtTime(c.end - c.start)}</span></div>
      <h2 class="hook">${esc(c.hook)}</h2>
      <div class="stage" style="background-image:url('https://i.ytimg.com/vi/${esc(c.vid)}/hqdefault.jpg')">
        <div class="slot"></div>
        <div class="poster" style="background-image:url('https://i.ytimg.com/vi/${esc(c.vid)}/hqdefault.jpg')"></div>
        <button class="tap" aria-label="Tap for sound or pause"><span class="paused-icon">${ICON.play}</span></button>
        <div class="pill">${ICON.muted}Tap for sound</div>
        <div class="bar"><i></i></div>
      </div>
      <div class="src"><b>${esc(c.channel)}</b> · <a class="title-link" href="https://www.youtube.com/watch?v=${esc(c.vid)}&t=${c.start}s"
        target="_blank" rel="noopener" title="Watch the full video on YouTube">${esc(c.title)}</a></div>
      ${c.summary ? `<button class="sum" aria-expanded="false">
          <span class="sum-text">${esc(c.summary)}</span>
          ${(c.points || []).length ? `<ul class="points">${c.points.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
          <span class="sum-more">Key points</span>` : ""}
        </button>` : `<p class="why">${esc(c.why)}</p>`}
      ${more ? `<div class="actions"><button class="pill-btn more" data-i="${i}">More from this video · ${more}</button></div>` : ""}
    </article>`;
}
const endCardHTML = () => `
    <div class="empty card"><h2>You're caught up</h2><p>${clips.filter(isSeen).length} clips watched. New clips land when the pipeline runs.
      Removed videos and your watch history are under <b>History</b>.</p>
      <button class="btn ghost" id="reset">Watch them again</button>
      <p style="font-size:12px">HN picks via <a href="https://hackertube.org">HackerTube</a> (ODC-By)</p></div>`;
function wireTail() {
  $("#reset").onclick = () => { seen.clear(); store.set("seen", []); skips = {}; store.set("skips", {}); renderChips(); renderFeed(); };
  document.querySelectorAll(".card[data-i]").forEach((el) => io.observe(el));
}

function renderFeed(custom) {
  leaveClip(true);
  destroyPlayer();
  order = custom || buildOrder();
  const feed = $("#feed");
  feed.scrollTop = 0;
  if (!clips.length) {
    feed.innerHTML = `<div class="empty"><h2>No clips yet</h2><p>Run the pipeline to fill the feed.</p></div>`;
    return;
  }
  const name = topicName();
  feed.innerHTML = order.map((c, i) => cardHTML(c, i, name)).join("") + endCardHTML();
  wireTail();
}

// "More from this video": move that video's next clip right after this card, and rebuild the cards below.
function playMore(i) {
  const next = moreFrom(i).sort((a, b) => a.start - b.start).find((c) => c.start > order[i].start) || moreFrom(i)[0];
  if (!next) return;
  order.splice(order.indexOf(next), 1);
  order.splice(i + 1, 0, next);
  for (const k of [...players.keys()]) if (k > i) dropPlayer(k);
  document.querySelectorAll(".card").forEach((el) => { if (!el.dataset.i || +el.dataset.i > i) { io.unobserve(el); el.remove(); } });
  const name = topicName();
  $("#feed").insertAdjacentHTML("beforeend", order.slice(i + 1).map((c, k) => cardHTML(c, i + 1 + k, name)).join("") + endCardHTML());
  const cur = cardAt(i).querySelector(".more");   // refresh this card's count
  if (cur) { const n = moreFrom(i).length; n ? (cur.textContent = `More from this video · ${n}`) : cur.parentElement.remove(); }
  wireTail();
  if (activeIdx === i) ensurePlayer(i + 1);
  $("#feed").scrollTo({ top: cardAt(i + 1).offsetTop, behavior: "smooth" });
}
$("#feed").addEventListener("click", (e) => {
  const b = e.target.closest(".more"); if (b) playMore(+b.dataset.i);
  const s = e.target.closest(".sum"); if (s) s.setAttribute("aria-expanded", s.getAttribute("aria-expanded") !== "true");
});

// ---------- players: the visible clip plays; the next one is loaded in advance so a swipe starts instantly
const players = new Map();   // card index -> { player, ready }
let player = null, activeCard = null, activeIdx = -1, tick = null, seenTimer = null, blockedTimer = null;
// "Seen" = watched more than half of the clip, or to the end. Swiping away after it really played counts as
// a skip: the clip comes back once at the end of the feed; skipped twice, it is gone.
let watched = 0, watchedClip = null;
function leaveClip(quiet) {
  const c = watchedClip; watchedClip = null;
  if (!c) return;
  if (watched >= (c.end - c.start) * 0.5) markSeen(c);
  else if (!quiet && watched >= 1 && !isSeen(c)) { skips[c.id] = (skips[c.id] || 0) + 1; store.set("skips", skips); }
  watched = 0;
}
const io = new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting && e.intersectionRatio > 0.6 && e.target !== activeCard) activate(e.target);
}, { root: document.getElementById("feed"), threshold: [0.6] });

const ytReady = new Promise((res) => {
  window.onYouTubeIframeAPIReady = res;
  const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
});

const cardAt = (i) => document.querySelector(`.card[data-i="${i}"]`);

function dropPlayer(i) {
  const p = players.get(i); if (!p) return;
  try { p.player.destroy(); } catch {}
  players.delete(i);
  const card = cardAt(i);
  if (card) { card.querySelector(".stage").classList.remove("sound", "paused", "playing"); card.querySelector(".slot").innerHTML = ""; }
}

function destroyPlayer() {   // used when the feed is rebuilt
  clearInterval(tick); clearTimeout(seenTimer); clearTimeout(blockedTimer);
  for (const i of [...players.keys()]) dropPlayer(i);
  player = null; activeCard = null; activeIdx = -1;
}

// Phones always allow a MUTED video to start by itself, but refuse sound until the person has tapped the
// page once. So every clip starts muted (it always plays), then sound is switched on right away once that is
// allowed. If the phone still refuses, the clip keeps playing muted with "Tap for sound".
let interacted = false, soundRefused = false;   // refused: stay muted until the next tap
const canSound = () => interacted || !!navigator.userActivation?.hasBeenActive;
function trySound(p, stage) {
  if (!canSound() || soundRefused || !p.isMuted()) return;
  p.unMute(); p.setVolume(100);
  setTimeout(() => {   // refused: the phone paused it. Go back to muted so it keeps playing.
    if (p.getPlayerState?.() !== YT.PlayerState.PLAYING) { soundRefused = true; p.mute(); p.playVideo(); }
    stage.classList.toggle("sound", !p.isMuted());
  }, 700);
}
function startPlayback(entry, c, stage) {
  const p = entry.player;
  p.mute(); p.seekTo(c.start, true); p.playVideo();
  clearTimeout(blockedTimer);
  blockedTimer = setTimeout(() => {   // still not playing: auto-play is blocked (e.g. Low Power Mode)
    if (players.get(activeIdx) === entry && p.getPlayerState?.() !== YT.PlayerState.PLAYING) stage.classList.add("paused");
  }, 2500);
}
// The first touch anywhere counts as the tap that allows sound.
for (const ev of ["pointerdown", "touchend", "keydown"]) addEventListener(ev, () => {
  if (interacted) return;
  interacted = true;
  const a = players.get(activeIdx);
  if (a?.ready && a.player.getPlayerState?.() === YT.PlayerState.PLAYING) trySound(a.player, activeCard.querySelector(".stage"));
}, { capture: true, passive: true });

function ensurePlayer(i) {
  if (players.has(i) || !order[i]) return players.get(i);
  const card = cardAt(i); if (!card) return;
  const c = order[i], stage = card.querySelector(".stage");
  const host = document.createElement("div"); host.className = "player";
  card.querySelector(".slot").appendChild(host);
  const entry = { player: null, ready: false };
  players.set(i, entry);
  entry.player = new YT.Player(host, {
    videoId: c.vid,
    playerVars: { start: c.start, end: c.end, autoplay: 0, mute: 1, playsinline: 1, controls: 0, rel: 0,
      modestbranding: 1, iv_load_policy: 3, disablekb: 1, fs: 0 },
    events: {
      onReady: () => { entry.ready = true; if (activeIdx === i) startPlayback(entry, c, stage); },
      onStateChange: (e) => {
        if (activeIdx !== i) { if (e.data === YT.PlayerState.PLAYING) e.target.pauseVideo(); return; }
        if (e.data === YT.PlayerState.ENDED) { advance(i); return; }
        if (e.data === YT.PlayerState.PLAYING) {
          stage.classList.remove("paused"); stage.classList.add("playing"); stage.classList.toggle("sound", !e.target.isMuted());
          trySound(e.target, stage);
        }
        if (e.data === YT.PlayerState.PAUSED) stage.classList.add("paused");
      },
    },
  });
  return entry;
}

async function activate(card) {
  await ytReady;
  const i = +card.dataset.i;
  const prev = players.get(activeIdx);
  if (prev?.ready) prev.player.pauseVideo();
  clearInterval(tick); clearTimeout(seenTimer);
  leaveClip(false);
  activeCard = card; activeIdx = i;
  const near = (el) => (el && el.dataset.i ? +el.dataset.i : null);
  const prevI = near(card.previousElementSibling), nextI = near(card.nextElementSibling);
  for (const k of [...players.keys()]) if (k !== i && k !== prevI && k !== nextI) dropPlayer(k);   // keep memory low
  const entry = ensurePlayer(i);
  if (nextI !== null) ensurePlayer(nextI);                                                         // preload the next clip
  player = entry.player;
  const c = order[i], stage = card.querySelector(".stage"), bar = card.querySelector(".bar i");
  if (entry.ready) startPlayback(entry, c, stage);
  watched = 0; watchedClip = c;
  tick = setInterval(() => {
    const t = player?.getCurrentTime?.(); if (t == null || activeIdx !== i) return;
    if (player.getPlayerState?.() === YT.PlayerState.PLAYING) watched += 0.25;
    bar.style.width = Math.max(0, Math.min(100, ((t - c.start) / (c.end - c.start)) * 100)) + "%";
    if (t >= c.end - 0.25) advance(i);
  }, 250);
}

function markSeen(c) {
  if (seen.has(c.id)) return;
  seen.add(c.id); store.set("seen", [...seen]);
  logHistory(c, "watched");
}

// When a clip ends, glide to the next one (like Shorts' auto-scroll). The last clip loops instead.
let advancedFrom = -1;
function advance(i) {
  if (advancedFrom === i || activeIdx !== i) return;
  markSeen(order[i]); watchedClip = null;
  const next = cardAt(i)?.nextElementSibling;
  if (!next || !next.dataset.i) { player?.seekTo(order[i].start, true); return; }
  advancedFrom = i;
  $("#feed").scrollTo({ top: next.offsetTop, behavior: "smooth" });
  setTimeout(() => { if (advancedFrom === i) advancedFrom = -1; }, 1500);
}

// ---------- swipe left on a card: remove that video (all its clips) from the feed, with Undo
let drag = null;
$("#feed").addEventListener("touchstart", (e) => {
  const card = e.target.closest(".card[data-i]"); if (!card || e.touches.length > 1) return;
  drag = { card, x: e.touches[0].clientX, y: e.touches[0].clientY, horiz: null, dx: 0 };
}, { passive: true });
$("#feed").addEventListener("touchmove", (e) => {
  if (!drag) return;
  const dx = e.touches[0].clientX - drag.x, dy = e.touches[0].clientY - drag.y;
  if (drag.horiz === null && (Math.abs(dx) > 12 || Math.abs(dy) > 12)) drag.horiz = Math.abs(dx) > Math.abs(dy) * 1.3 && dx < 0;
  if (!drag.horiz) return;
  drag.dx = Math.min(0, dx);
  drag.card.classList.remove("springback");
  drag.card.style.transform = `translateX(${drag.dx}px) rotate(${drag.dx / 45}deg)`;
  drag.card.style.opacity = String(Math.max(0.35, 1 + drag.dx / (innerWidth * 1.4)));
  const hint = $("#swipe-hint"), armed = drag.dx < -innerWidth * 0.28;
  hint.style.opacity = String(Math.min(1, -drag.dx / (innerWidth * 0.2)));
  if (armed !== hint.classList.contains("armed")) {
    hint.classList.toggle("armed", armed);
    if (armed) navigator.vibrate?.(12);   // a small tick at the point of no return (Android)
  }
}, { passive: true });
$("#feed").addEventListener("touchend", () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.horiz) return;
  const hint = $("#swipe-hint");
  if (d.dx < -innerWidth * 0.28) removeVideo(d.card);
  else {
    d.card.classList.add("springback"); d.card.style.transform = ""; d.card.style.opacity = "";
    hint.style.transition = "opacity .25s, transform .18s, color .18s"; hint.style.opacity = "0"; hint.classList.remove("armed");
    setTimeout(() => { d.card.classList.remove("springback"); hint.style.transition = ""; }, 400);
  }
});

function removeVideo(card) {
  const c = order[+card.dataset.i]; if (!c) return;
  removed.add(c.vid); store.set("removed", [...removed]);
  logHistory(c, "removed");
  if (activeCard === card) { clearInterval(tick); watchedClip = null; }
  const hint = $("#swipe-hint");
  card.classList.remove("springback"); card.classList.add("leaving");
  card.style.transform = "translateX(-125%) rotate(-14deg)"; card.style.opacity = "0";
  setTimeout(() => {
    hint.style.transition = "opacity .3s"; hint.style.opacity = "0"; hint.classList.remove("armed");
    setTimeout(() => (hint.style.transition = ""), 320);
    const feed = $("#feed");
    document.querySelectorAll(".card[data-i]").forEach((el) => {
      const k = +el.dataset.i;
      if (order[k]?.vid === c.vid) { dropPlayer(k); io.unobserve(el); el.remove(); }
    });
    if (activeCard && !activeCard.isConnected) { activeCard = null; activeIdx = -1; player = null; }
    const now = [...document.querySelectorAll(".card")].find((el) => Math.abs(el.offsetTop - feed.scrollTop) < feed.clientHeight / 2);
    if (now?.dataset.i) {
      now.classList.add("entering");
      now.addEventListener("animationend", () => now.classList.remove("entering"), { once: true });
      activate(now);
    }
    renderChips();
    toast("Removed from your feed", "Undo", () => restoreVideo(c.vid, c.id));
  }, 320);
}
function restoreVideo(vid, focusId) {
  removed.delete(vid); store.set("removed", [...removed]);
  history = history.filter((h) => !(h.vid === vid && h.kind === "removed")); store.set("history", history);
  renderChips();
  if (historyOpen) { renderHistory(); return; }
  renderFeed();
  const k = order.findIndex((x) => x.id === focusId || x.vid === vid);
  if (k >= 0) $("#feed").scrollTo({ top: cardAt(k).offsetTop });
}

let toastTimer = null;
function toast(msg, action, fn) {
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action)}</button>` : ""}`;
  t.classList.add("on");
  if (action) t.querySelector("button").onclick = () => { t.classList.remove("on"); fn(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 5000);
}

// ---------- History: what you watched (tap to replay) and what you removed (restore)
let historyOpen = false, historyTab = "watched";
const ago = (t) => { const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
function openHistory() {
  historyOpen = true; player?.pauseVideo?.();
  $("#history").hidden = false; renderHistory(); renderChips();
}
function closeHistory(rerender = true) {
  historyOpen = false; $("#history").hidden = true;
  if (rerender) { renderChips(); }
}
function renderHistory() {
  const list = history.filter((h) => h.kind === historyTab);
  const n = (k) => history.filter((h) => h.kind === k).length;
  $("#history").innerHTML = `
    <div class="h-tabs">
      <button data-tab="watched" aria-pressed="${historyTab === "watched"}">Watched · ${n("watched")}</button>
      <button data-tab="removed" aria-pressed="${historyTab === "removed"}">Removed · ${n("removed")}</button>
    </div>
    ${list.length ? `<ul class="h-list">${list.map((h) => `
      <li class="h-item" data-id="${esc(h.id)}" data-vid="${esc(h.vid)}">
        <img src="https://i.ytimg.com/vi/${esc(h.vid)}/mqdefault.jpg" alt="" loading="lazy">
        <div class="h-meta"><b>${esc(h.hook)}</b><span>${esc(h.channel)} · ${ago(h.at)}</span></div>
        ${h.kind === "removed" ? `<button class="btn ghost h-restore">Restore</button>` : ""}
      </li>`).join("")}</ul>`
      : `<p class="h-empty">${historyTab === "watched" ? "Clips you watch past halfway show up here." : "Swipe a clip left to remove its video. It shows up here so you can bring it back."}</p>`}
    ${historyTab === "watched" && list.length ? `<button class="btn ghost h-clear">Clear watch history</button>` : ""}`;
}
$("#history").addEventListener("click", (e) => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { historyTab = tab.dataset.tab; renderHistory(); return; }
  const item = e.target.closest(".h-item");
  if (e.target.closest(".h-restore") && item) { restoreVideo(item.dataset.vid, item.dataset.id); toast("Back in your feed"); return; }
  if (e.target.closest(".h-clear")) {
    if (!confirm("Clear your watch history? Watched clips will show up in the feed again.")) return;
    history = history.filter((h) => h.kind !== "watched"); store.set("history", history);
    seen.clear(); store.set("seen", []); renderHistory(); renderChips(); return;
  }
  if (item && historyTab === "watched") {   // replay: this clip first, then the normal feed
    const h = history.find((x) => x.id === item.dataset.id);
    const c = clips.find((x) => x.id === h.id) || clips.find((x) => x.vid === h.vid && Math.abs(x.start - h.start) < 90);
    if (!c) { open(`https://www.youtube.com/watch?v=${h.vid}&t=${h.start}s`, "_blank", "noopener"); return; }
    closeHistory(); renderChips();
    renderFeed([c, ...buildOrder().filter((x) => x.id !== c.id)]);
  }
});

$("#feed").addEventListener("click", (e) => {
  const tap = e.target.closest(".tap"); if (!tap || !player || !activeCard?.contains(tap)) return;
  const stage = tap.closest(".stage");
  interacted = true; soundRefused = false;
  if (player.isMuted()) { player.unMute(); player.setVolume(100); stage.classList.add("sound"); player.playVideo(); }
  else if (player.getPlayerState?.() !== YT.PlayerState.PLAYING) player.playVideo();
  else player.pauseVideo();
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) return;
  player?.pauseVideo?.();
  const c = watchedClip; if (c && watched >= (c.end - c.start) * 0.5) markSeen(c);   // leaving the app: no skip
});
document.addEventListener("keydown", (e) => {
  const feed = $("#feed");
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); feed.scrollBy({ top: innerHeight, behavior: "smooth" }); }
  if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); feed.scrollBy({ top: -innerHeight, behavior: "smooth" }); }
  if (e.key === " " || e.key === "m") { e.preventDefault(); activeCard?.querySelector(".tap").click(); }
  if (e.key === "x" && activeCard) removeVideo(activeCard);
});

load();
</script>
</body>
</html>
