<style>
  :root {
    --bg: #0b0b0c; --card: #121214; --text: #f4f4f2; --muted: #9a9a96; --line: rgba(255,255,255,.12);
    --accent: #e8ff6b; --accent-text: #0b0b0c; --chip: rgba(255,255,255,.08);
    --top: calc(env(safe-area-inset-top) + 56px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 15px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; touch-action: manipulation; }
  html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  #feed { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  a { color: inherit; }

  /* topic chips */
  header { position: fixed; z-index: 20; inset: 0 0 auto 0; padding: env(safe-area-inset-top) 0 0;
    background: linear-gradient(rgba(0,0,0,.55), transparent); pointer-events: none; }
  header .chips { pointer-events: auto; }
  .chips { display: flex; gap: 8px; padding: 10px 16px 14px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.14);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--text);
    font-size: 14px; font-weight: 600; white-space: nowrap; transition: background .15s, color .15s; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  .chip .n { opacity: .55; font-weight: 500; margin-left: 4px; }

  /* feed */
  /* A fixed full-screen layer: the browser's address bar never resizes cards mid-swipe. */
  #feed { position: fixed; inset: 0; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain;
    scrollbar-width: none; }
  #feed::-webkit-scrollbar { display: none; }
  .card { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
    padding: var(--top) 16px calc(env(safe-area-inset-bottom) + 20px); }
  .card > * { position: relative; z-index: 1; }
  /* Shorts-style backdrop: the video's own thumbnail, blurred, fills the screen */
  .card > .bg { position: absolute; z-index: 0; inset: -40px; background: #000 center / cover no-repeat; }
  /* the blur only runs on cards near the screen: a blurred full-screen layer for every card would use up a phone's graphics memory */
  .card.near > .bg { filter: blur(28px) brightness(.38) saturate(1.3); }
  .meta-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .tag { color: var(--accent); font-weight: 700; letter-spacing: .02em; text-transform: uppercase; font-size: 12px; }
  .hook { margin: 0; font-size: clamp(22px, 6.4vw, 30px); line-height: 1.15; font-weight: 750;
    letter-spacing: -.02em; text-wrap: balance; }
  .stage { position: relative; width: calc(100% + 32px); margin: 0 -16px; aspect-ratio: 16 / 9; overflow: hidden;
    background: #000 center / cover no-repeat; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .stage iframe, .stage .player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* thumbnail stays on top until the video is really playing, so there is no black flash */
  .poster { position: absolute; inset: 0; z-index: 1; background: #000 center / cover no-repeat;
    transition: opacity .35s; pointer-events: none; }
  .stage.playing .poster { opacity: 0; }
  .tap { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; }
  /* top centre, between the buttons: never over the captions, which sit at the bottom of the video */
  .pill { position: absolute; z-index: 3; left: 50%; top: 10px; transform: translateX(-50%); white-space: nowrap; display: flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 999px; background: rgba(0,0,0,.66); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); font-size: 13px; font-weight: 600; pointer-events: none;
    transition: opacity .3s; }
  .pill svg { width: 16px; height: 16px; fill: currentColor; }
  .stage.sound .pill { opacity: 0; }
  .paused-icon { width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,.55); display: none;
    place-items: center; }
  .paused-icon svg { width: 28px; height: 28px; fill: #fff; margin-left: 4px; }
  .stage.paused .paused-icon { display: grid; }
  .bar { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.18); }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .src { font-size: 14px; color: rgba(255,255,255,.72); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; }
  .src b { color: var(--text); font-weight: 600; }
  .why { font-size: 14px; color: rgba(255,255,255,.72); margin: -4px 0 0; }
  /* summary from the transcript: 3 lines, tap to open the key points */
  .sum { display: block; text-align: left; font-size: 14.5px; line-height: 1.45; color: rgba(255,255,255,.86);
    margin: -4px 0 0; }
  .sum-text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .sum .points { display: none; margin: 8px 0 0; padding-left: 18px; color: rgba(255,255,255,.78); }
  .sum .points li { margin: 3px 0; }
  .sum-more { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--accent); }
  .sum[aria-expanded="true"] .sum-text { -webkit-line-clamp: unset; }
  .sum[aria-expanded="true"] .points { display: block; }
  .sum[aria-expanded="true"] .sum-more { display: none; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .title-link { color: inherit; text-decoration: underline; text-decoration-color: rgba(255,255,255,.35);
    text-underline-offset: 3px; }
  .title-link:active, .title-link:hover { color: var(--text); text-decoration-color: currentColor; }
  .pill-btn { padding: 7px 13px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: 13px; font-weight: 600; }
  .card[data-i] { touch-action: pan-y; transform-origin: 50% 85%; }
  /* swipe-to-remove: a label waits behind the feed and shows through as the card moves away */
  #feed { z-index: 1; }
  #swipe-hint { position: fixed; z-index: 0; top: 50%; right: 22px; transform: translateY(-50%) scale(.85);
    display: grid; justify-items: center; gap: 8px; color: rgba(255,255,255,.6); font-weight: 700; font-size: 13px;
    opacity: 0; transition: transform .18s, color .18s; pointer-events: none; }
  #swipe-hint svg { width: 30px; height: 30px; fill: currentColor; }
  #swipe-hint.armed { color: var(--accent); transform: translateY(-50%) scale(1.08); }
  .card.leaving { transition: transform .32s cubic-bezier(.5,0,.75,0), opacity .32s; }
  .card.springback { transition: transform .38s cubic-bezier(.2,1.5,.4,1), opacity .25s; }
  .card.entering { animation: enter .42s cubic-bezier(.2,.9,.3,1); }
  @keyframes enter { from { opacity: 0; transform: scale(.94) translateY(14px); } to { opacity: 1; transform: none; } }   /* vertical swipes scroll; horizontal ones are ours */
  .chip.hist { margin-left: auto; }
  .chip.hist[aria-pressed="true"] svg { fill: var(--accent-text); }
  .chip.hist[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  #toast { position: fixed; z-index: 40; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px);
    transform: translate(-50%, 140%); display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 16px;
    border-radius: 999px; background: #f4f4f2; color: #0b0b0c; font-weight: 600; font-size: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); transition: transform .25s, opacity .25s; white-space: nowrap;
    opacity: 0; pointer-events: none; }
  #toast.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  #toast button { color: #0b0b0c; background: var(--accent); padding: 6px 12px; border-radius: 999px; font-weight: 700; }
  #history, #search { position: fixed; z-index: 15; inset: 0; overflow-y: auto; background: var(--bg);
    padding: calc(var(--top) + 4px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  #history[hidden], #search[hidden] { display: none; }
  #q { width: 100%; margin-bottom: 14px; padding: 12px 14px; border-radius: 12px; border: 0; outline: none;
    background: var(--chip); color: var(--text); font: inherit; font-size: 16px; }
  .h-unsave { min-height: 36px; padding: 0 12px; font-size: 13px; }
  .stats { margin: 0 0 12px; color: var(--muted); font-size: 14px; }

  .play-saved { margin: 0 0 14px; }
  .play-saved svg { width: 18px; height: 18px; fill: currentColor; }
  .new { padding: 2px 7px; border-radius: 6px; background: var(--accent); color: var(--accent-text);
    font-size: 11px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; }
  #mode { position: fixed; z-index: 21; left: 50%; top: calc(env(safe-area-inset-top) + 62px); transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; border-radius: 999px;
    background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: 13px; }
  #mode[hidden] { display: none; }
  #mode button { width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,.15); font-weight: 800; }
  .chip svg { width: 18px; height: 18px; fill: currentColor; display: block; }
  .chip.hist { padding: 7px 11px; }
  .pill-btn { display: inline-flex; align-items: center; gap: 6px; }
  .pill-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .pill-btn.save[aria-pressed="true"] { color: var(--accent); }
  .fs { position: absolute; z-index: 3; top: 8px; left: 8px; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; background: rgba(0,0,0,.6); }
  .fs svg { width: 20px; height: 20px; fill: #fff; }
  /* Full screen: the clip's video fills the screen; text, buttons and chips step aside.
     Also automatic when a phone is turned sideways. */
  body.immersive header, body.immersive #mode, body.immersive #recall-pill, body.immersive #keys { display: none; }
  body.immersive .card[data-i] { display: block; padding: 0; max-width: none; background: #000; }
  body.immersive .card[data-i] > :not(.stage) { display: none; }
  body.immersive .card[data-i] > .stage { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;
    aspect-ratio: auto; border-radius: 0; box-shadow: none; background-size: contain; background-color: #000; }
  body.immersive .stage .poster { background-size: contain; }

    header, #mode, #recall-pill, #keys { display: none; }

    .card[data-i] > :not(.stage) { display: none; }
    .card[data-i] > .stage { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;
      aspect-ratio: auto; border-radius: 0; box-shadow: none; background-size: contain; background-color: #000; }
    .stage .poster { background-size: contain; }
  }
  .cc { position: absolute; z-index: 3; top: 10px; right: 58px; padding: 4px 8px; border-radius: 999px;
    background: rgba(0,0,0,.6); font-size: 12px; font-weight: 800; letter-spacing: .02em; opacity: .75; }
  .cc[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); opacity: 1; }
  .cc-report { margin: 0 0 12px; padding: 12px; border-radius: 12px; background: var(--chip); font: 12px/1.5 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; word-break: break-word; color: rgba(255,255,255,.86); }
  .tips-card .btn + .btn { margin-top: 8px; }

  .burst { position: absolute; z-index: 4; left: 50%; top: 50%; width: 90px; height: 90px; margin: -45px 0 0 -45px;
    color: var(--accent); opacity: 0; pointer-events: none; }
  .burst svg { width: 100%; height: 100%; fill: currentColor; filter: drop-shadow(0 4px 14px rgba(0,0,0,.5)); }
  .burst.go { animation: burst .8s ease-out; }
  @keyframes burst { 0% { opacity: 0; transform: scale(.4); } 20% { opacity: 1; transform: scale(1.15); }
    45% { transform: scale(.95); } 100% { opacity: 0; transform: scale(1.05) translateY(-30px); } }
  .h-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .h-tabs button { padding: 8px 14px; border-radius: 10px; background: var(--chip); font-weight: 600; font-size: 14px; }
  .h-tabs button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .h-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }

  .h-meta { display: grid; gap: 3px; min-width: 0; }

  .h-meta span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .h-restore { min-height: 36px; padding: 0 12px; font-size: 13px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px;

    text-decoration: none; font-size: 15px; }
  .btn.ghost { background: var(--chip); color: var(--text); }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }

  .empty p { margin: 0; color: var(--muted); max-width: 32ch; }
  @media (min-width: 700px) { .card { padding-left: calc(50% - 280px); padding-right: calc(50% - 280px); }
    .stage { width: 100%; margin: 0; border-radius: 14px; } }
  /* Desktop: video on the left, everything to read on the right, key points open, shortcuts shown */

      padding: var(--top) 48px 48px; max-width: 1500px; margin: 0 auto; }

  #keys { display: none; position: fixed; z-index: 5; left: 16px; bottom: 12px; font-size: 12px; color: rgba(255,255,255,.45); }

  .ch { cursor: pointer; font-weight: 700; color: var(--text); text-decoration: underline; text-decoration-color: transparent; }

  .flag-menu button:last-child { background: none; color: var(--muted); }
  .pill-btn.flag { padding: 7px 10px; color: rgba(255,255,255,.7); }
  .h-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 14px; }

  .rq-watch { color: var(--accent); font-weight: 700; margin-left: 6px; }
  .rq-grade { display: flex; gap: 10px; margin-top: 16px; }
  .chip.today { background: rgba(232,255,107,.16); }
  .chip.today[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  /* floats above the buttons, so opening it never changes the card's layout */
  .more-menu { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 6; display: grid; gap: 2px;

  .more-menu button { text-align: left; padding: 13px 14px; border-radius: 12px; font-size: 14.5px; font-weight: 600; }

  .more-menu button:only-child { border-radius: 12px; }

  #tips { position: fixed; z-index: 60; inset: 0; display: grid; place-items: center; padding: 22px;
    background: rgba(0,0,0,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #tips[hidden] { display: none; }

let topics = [], clips = [], seen = new Set(store.get("seen", []).map(String)), selected = store.get("selected", null);

async function load() {

  paths = Array.isArray(pa) ? pa : []; debates = Array.isArray(de) ? de : [];

  clips = c;
  markNew();
  bestOf = {};
  for (const k of clips) if (!bestOf[k.vid] || k.substance > bestOf[k.vid].substance) bestOf[k.vid] = k;

function isSeen(c) {
  if (seen.has(c.id)) return true;

  for (const s of seen) {
    if (s.length > 12 && s.slice(0, 11) === c.vid && Math.abs(+s.slice(12) - c.start) < 90) return true;

let bestOf = {};   // video id -> its highest-scoring clip

$("#history").addEventListener("click", (e) => {

  if (e.target.closest(".h-tips")) { closeHistory(false); showTips(); renderChips(); return; }
  if (e.target.closest(".h-cc")) { closeHistory(false); showCaptionReport(); renderChips(); return; }
  const item = e.target.closest(".h-item");
  if (item && e.target.closest(".note-save")) { saveNote(item); return; }
  if (item && e.target.closest(".note-cancel")) { renderHistory(); return; }
  if (item && e.target.closest(".h-note")) { openNoteEditor(item); return; }
  if (e.target.closest(".note-edit")) return;   // typing in the editor never replays the clip
  if (e.target.closest(".h-restore") && item) { restoreVideo(item.dataset.vid, item.dataset.id); toast("Back in your feed"); return; }
  if (e.target.closest(".h-unsave") && item) { unsave(item.dataset.id); renderHistory(); return; }
  if (e.target.closest(".h-unflag") && item) { delete flags[item.dataset.id]; store.set("flags", flags); renderHistory(); renderChips(); return; }
  if (e.target.closest(".export-saved")) { exportSaved(); return; }
  if (e.target.closest(".send-flags")) { sendFlags(); return; }
  if (e.target.closest(".h-recall")) { openRecall(); return; }
  if (e.target.closest(".play-saved")) {   // your saved clips, newest first, as their own swipe feed
    const list = saved.map(findClip).filter(Boolean);
    if (!list.length) { toast("Those clips are no longer in the feed"); return; }
    closeHistory(); renderChips(); renderFeed(list, `Saved · ${list.length}`); return;
  }
  if (e.target.closest(".h-clear")) {
    if (!confirm("Clear your watch history? Watched clips will show up in the feed again.")) return;
    history = history.filter((h) => h.kind !== "watched"); store.set("history", history);
    seen.clear(); store.set("seen", []); renderHistory(); renderChips(); return;
  }
  if (item && historyTab !== "removed" && historyTab !== "flagged") {   // replay: this clip first, then the normal feed
    const h = (historyTab === "saved" ? saved : history).find((x) => x.id === item.dataset.id);
    closeHistory(); renderChips();
    playFirst(h);
  }
});

// Put one clip at the top of the feed (from History, Saved, Search or a shared link).
function findClip(ref) {
  return clips.find((x) => x.id === ref.id) ||
         clips.find((x) => x.vid === ref.vid && Math.abs(x.start - (ref.start ?? -999)) < 90);
}
function playFirst(ref) {
  const c = findClip(ref);
  if (!c) { if (ref.vid) open(`https://www.youtube.com/watch?v=${ref.vid}&t=${ref.start || 0}s`, "_blank", "noopener"); return false; }
  renderFeed([c, ...buildOrder().filter((x) => x.id !== c.id)]);
  return true;
}

// ---------- Share: a link that opens the feed on this exact clip
async function shareClip(c) {
  const url = `${location.origin}${location.pathname}?clip=${encodeURIComponent(c.id)}`;
  try {
    if (navigator.share) { await navigator.share({ title: c.hook, text: `${c.hook} (${c.channel})`, url }); return; }

// ---------- Full screen: the video fills the screen and swiping still moves between clips.

// ---------- More ▾: next clip from this talk · the whole talk in order · more on the same idea

function moreAction(act, card) {
  const i = +card.dataset.i, c = order[i];
  if (act === "next") { playMore(i); return; }
  if (act === "talk") {   // every clip of this video, in the order they appear in it
    const list = clips.filter((x) => x.vid === c.vid && clipOk(x)).sort((a, b) => a.start - b.start);
    const mins = Math.max(1, Math.round(list.reduce((a, x) => a + (x.end - x.start), 0) / 60));
    renderFeed(list, `Talk in order · ${list.length} clips · ${mins} min`, "talk"); renderChips(); return;
  }
  if (act === "path") { const x = paths.find((q) => q.steps.includes(c.id)); if (x) openPath(x.id, c.id); return; }
  if (act === "debate") { const x = debates.find((q) => q.sides.some((s) => s.clips.includes(c.id))); if (x) openDebate(x.id, c.id); return; }
  if (act === "subject") {   // the other clips on the same idea: unseen first, best first
    const list = clips.filter((x) => x.subject === c.subject && x.id !== c.id && clipOk(x))
      .sort((a, b) => isSeen(a) - isSeen(b) || b.substance - a.substance);
    renderFeed(list, `${c.subject} · ${list.length}`); renderChips();
  }
}

// ---------- Today's five: the 5 best unseen clips for the day, then "done for today"
function todaysFive() {
  if (fiveState?.day === today()) return fiveState.ids.map((id) => clips.find((c) => c.id === id)).filter(Boolean);
  const cap = selected.length === 1 ? 5 : 3, perTopic = {}, vids = new Set(), subs = new Set(), out = [];
  const pool = clips.filter((c) => available(c) && selected.includes(c.topic))
    .sort((a, b) => isNew(b) - isNew(a) || b.substance - a.substance);
  for (const c of pool) {
    if (out.length === 5) break;
    if (vids.has(c.vid) || subs.has(c.subject) || (perTopic[c.topic] || 0) >= cap) continue;
    out.push(c); vids.add(c.vid); subs.add(c.subject); perTopic[c.topic] = (perTopic[c.topic] || 0) + 1;
  }
  fiveState = { day: today(), ids: out.map((c) => c.id) }; store.set("five", fiveState);

}
const fiveLeft = () => todaysFive().filter((c) => !isSeen(c) && clipOk(c)).length;
function todayChip() {
  if (!clips.length) return "";

// ---------- Move to another device: one code or file with your history, saves, notes, recall progress, settings
const TX_KEYS = ["seen", "skips", "removed", "history", "saved", "notes", "rate", "captions", "selected", "watchLog", "flags", "recall", "recallDay", "level", "listenRate", "listenPoints", "browseTab"];
const b64 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64 = (s) => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
  const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
const snapshotAll = () => { const data = {}; for (const k of TX_KEYS) { const v = store.get(k, undefined); if (v !== undefined) data[k] = v; }
  return { app: "signal-shorts", v: 1, at: Date.now(), data }; };
async function encodeCode(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  try {
    if (typeof CompressionStream !== "undefined")
      return "SS1." + b64(new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer()));
  } catch {}
  return "SS0." + b64(bytes);
}
async function decodeCode(text) {
  const t = text.trim();
  if (t.startsWith("{")) return JSON.parse(t);   // a saved file
  const m = t.replace(/\s+/g, "").match(/^SS([01])\.(.+)$/); if (!m) throw new Error("format");
  let bytes = unb64(m[2]);
  if (m[1] === "1") bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(bytes));
}
// Merge, never overwrite: watched/removed/saved are combined, counters keep the larger value, local notes win.
function mergeIn(d) {
  const cur = (k, def) => store.get(k, def);
  const union = (a, b) => [...new Set([...(a || []), ...(b || [])])];
  const byId = (a, b, key = (x) => x.id) => { const m = new Map(); for (const x of [...(b || []), ...(a || [])]) m.set(key(x), x); return [...m.values()]; };
  const maxMap = (a, b) => { const m = { ...a }; for (const [k, v] of Object.entries(b || {})) m[k] = Math.max(m[k] || 0, v); return m; };
  if (d.seen) store.set("seen", union(cur("seen", []), d.seen));
  if (d.removed) store.set("removed", union(cur("removed", []), d.removed));
  if (d.saved) store.set("saved", byId(cur("saved", []), d.saved).sort((x, y) => y.at - x.at));
  if (d.history) store.set("history", byId(cur("history", []), d.history, (x) => x.kind + ":" + x.id).sort((x, y) => y.at - x.at).slice(0, 300));
  if (d.skips) store.set("skips", maxMap(cur("skips", {}), d.skips));
  if (d.watchLog) store.set("watchLog", maxMap(cur("watchLog", {}), d.watchLog));
  if (d.notes) store.set("notes", { ...d.notes, ...cur("notes", {}) });
  if (d.flags) store.set("flags", { ...d.flags, ...cur("flags", {}) });
  if (d.recall) { const m = { ...cur("recall", {}) }; for (const [k, v] of Object.entries(d.recall)) if (!m[k] || (v.due || 0) > (m[k].due || 0)) m[k] = v; store.set("recall", m); }
  if (d.recallDay) store.set("recallDay", [cur("recallDay", ""), d.recallDay].sort().pop());
  for (const k of ["rate", "captions", "selected", "level", "listenRate", "listenPoints", "browseTab"]) if (d[k] !== undefined) store.set(k, d[k]);
}

// ---------- Listen: the phone's own voice reads each clip's summary aloud, hands-free
const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
const LISTEN_RATES = [0.85, 1, 1.2, 1.4, 1.7];
let listenRate = store.get("listenRate", 1), listenPoints = store.get("listenPoints", true);

let voice = null;
function pickVoice() {

    animateOut(card, (x) => x.id === c.id, () => toast("Thanks, hidden. Send flags from History", "Undo", () => {

// ---------- Daily recall: 3 clips you saved or watched come back as a question (spaced repetition)
const DAYS = [1, 3, 7, 14, 30];
const today = () => new Date().toISOString().slice(0, 10);
function recallQueue() {
  const pool = [...saved, ...history.filter((h) => h.kind === "watched")].map(findClip)
    .filter((c, k, a) => c && c.quiz && a.findIndex((x) => x && x.id === c.id) === k);
  const savedIds = new Set(saved.map((s) => s.id));
  return pool.filter((c) => (recall[c.id]?.due || 0) <= Date.now())
    .sort((a, b) => (savedIds.has(b.id) - savedIds.has(a.id)) || ((recall[a.id]?.due || 0) - (recall[b.id]?.due || 0)))
    .slice(0, 3);
}

    return;

}

      <button class="btn sheet-close">Back to the feed</button></div>`; return;

      <div class="rq-grade"><button class="btn ghost" data-g="0">Not quite</button><button class="btn" data-g="1">I knew it</button></div>

}

  if (e.target.closest(".tx-save")) { txSaveFile(); return; }
  if (e.target.closest(".tx-import")) { txImport($("#tx-in").value); return; }
  if (e.target.closest(".listen")) { listenClick(e); return; }
  const bt = e.target.closest("[data-btab]"); if (bt) { openBrowse(bt.dataset.btab); return; }
  const pg = e.target.closest(".path-go"); if (pg) { openPath(pg.dataset.path); return; }
  const pls = e.target.closest(".path-listen"); if (pls) { listenPath(pls.dataset.path); return; }
  const dg = e.target.closest(".debate-go"); if (dg) { openDebate(dg.dataset.debate); return; }
  const dl = e.target.closest(".debate-listen"); if (dl) { listenDebate(dl.dataset.debate); return; }
  const pl = e.target.closest(".play-list");
  if (pl) { const list = sheetLists[pl.dataset.list]; const t = pl.dataset.list === "all" ? $("#sheet h2").textContent : pl.querySelector("span").textContent;
            closeSheet(); renderFeed(list, `${t} · ${list.length}`); return; }
  const it = e.target.closest(".h-item, .b-tile, .rq-watch");
  if (it) { closeSheet(); playFirst({ id: it.dataset.id }); return; }
  if (e.target.closest(".rq-show")) { e.target.closest(".rq-show").hidden = true; $(".rq-a").hidden = false; return; }
  const g = e.target.closest("[data-g]"); if (g) gradeRecall(g.dataset.g === "1");
});

// ---------- Search: hooks, summaries, key points, titles, channels and subjects
let searchOpen = false;
function openSearch() {
  if (historyOpen) closeHistory(false);
  if (sheetOpen) closeSheet(false);
  searchOpen = true; player?.pauseVideo?.();
  const s = $("#search"); s.hidden = false;
  s.innerHTML = `<input id="q" type="search" placeholder="Search clips: RAG, Karpathy, pricing…" autocomplete="off" enterkeyhint="search">
    <ul class="h-list" id="results"></ul>`;
  $("#q").addEventListener("input", runSearch);
  runSearch(); renderChips(); setTimeout(() => $("#q").focus(), 50);
}
function closeSearch(rerender = true) { searchOpen = false; $("#search").hidden = true; if (rerender) { renderChips(); resumeActive(); } }
function runSearch() {
  const terms = $("#q").value.toLowerCase().split(/\s+/).filter(Boolean);
  const name = topicName();
  const hay = (c) => [c.hook, c.summary, ...(c.points || []), c.title, c.channel, c.subject, c.level, name[c.topic]].join(" ").toLowerCase();
  const hits = terms.length ? clips.filter((c) => !removed.has(c.vid) && terms.every((t) => hay(c).includes(t)))
    .sort((a, b) => b.substance - a.substance).slice(0, 60) : [];
  $("#results").innerHTML = !terms.length ? `<p class="h-empty">Search every clip by what's said in it, its title or its channel.</p>`
    : hits.length ? hits.map((c) => `
      <li class="h-item" data-id="${esc(c.id)}">
        <img src="https://i.ytimg.com/vi/${esc(c.vid)}/mqdefault.jpg" alt="" loading="lazy">
        <div class="h-meta"><b>${esc(c.hook)}</b><span>${esc(c.channel)}${isSeen(c) ? " · watched" : ""}</span></div>
      </li>`).join("") : `<p class="h-empty">No clips match “${esc(terms.join(" "))}”.</p>`;
}
$("#search").addEventListener("click", (e) => {
  const item = e.target.closest(".h-item"); if (!item) return;
  closeSearch(); playFirst({ id: item.dataset.id });
});

let lastTap = 0, tapTimer = null;
$("#feed").addEventListener("click", (e) => {
  const card = e.target.closest(".card[data-i]"), c = card && order[+card.dataset.i];
  if (e.target.closest(".save") && c) { toggleSave(c); return; }
  if (e.target.closest(".share") && c) { shareClip(c); return; }
  if (e.target.closest(".flag") && card) { askBadCut(card); return; }
  const ch = e.target.closest(".ch"); if (ch) { openChannel(ch.dataset.ch); return; }
  if (e.target.closest(".fs")) { toggleImmersive(); return; }
  if (e.target.closest(".cc")) { setCaptions(!captions); return; }
  if (e.target.closest(".speed")) {
    rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length]; store.set("rate", rate);
    document.querySelectorAll(".speed").forEach((b) => (b.textContent = `${rate}×`));
    for (const { player: pl, ready } of players.values()) if (ready) pl.setPlaybackRate?.(rate);
    return;
  }
  const tap = e.target.closest(".tap"); if (!tap || !player || !activeCard?.contains(tap)) return;
  const stage = tap.closest(".stage"), now = Date.now();
  if (now - lastTap < 300) {   // double-tap: save, with a heart
    clearTimeout(tapTimer); lastTap = 0;
    if (c && !isSaved(c)) { save(c); afterSave(c); }
    const h = stage.querySelector(".burst"); h.classList.remove("go"); void h.offsetWidth; h.classList.add("go");
    return;
  }
  lastTap = now;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => {   // single tap: sound on, or pause / play
    interacted = true; soundRefused = false;
    if (player.isMuted()) { player.unMute(); player.setVolume(100); stage.classList.add("sound"); player.playVideo(); }
    else if (player.getPlayerState?.() !== YT.PlayerState.PLAYING) player.playVideo();
    else player.pauseVideo();
  }, 260);
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { if (listen.playing) { keepAwake(true); speakFrom(listen.chunk); } return; }
  player?.pauseVideo?.();
  store.set("watchLog", watchLog);
  const c = watchedClip; if (c && watched >= (c.end - c.start) * 0.5) markSeen(c);   // leaving the app: no skip
});
document.addEventListener("keydown", (e) => {
  if (!$("#tips").hidden) { if (e.key === "Escape" || e.key === "Enter") hideTips(); return; }
  if (searchOpen || e.target.closest?.("input, textarea")) { if (e.key === "Escape") closeSearch(); return; }
  if (sheetOpen === "listen") {
    if (e.key === " ") { e.preventDefault(); listen.playing ? pauseListen() : playListen(); return; }
    if (e.key === "ArrowRight") { stepListen(1); return; }
    if (e.key === "ArrowLeft") { prevListen(); return; }
  }
  if (e.key === "Escape") { if (sheetOpen) closeSheet(); if (historyOpen) closeHistory(); return; }
  if (e.key === "/") { e.preventDefault(); openSearch(); return; }
  if (e.key === "b") { openBrowse(); return; }
  if (e.key === "t") { openToday(); return; }
  if (e.key === "f") { toggleImmersive(); return; }
  if (e.key === "r") { openRecall(); return; }
  if (e.key === "l") { openListen(); return; }
  const feed = $("#feed");
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); feed.scrollBy({ top: innerHeight, behavior: "smooth" }); }
  if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); feed.scrollBy({ top: -innerHeight, behavior: "smooth" }); }
  if (e.key === " " || e.key === "m") { e.preventDefault(); activeCard?.querySelector(".tap").click(); }
  if (e.key === "x" && activeCard) removeVideo(activeCard);
  if (e.key === "s" && activeCard) toggleSave(order[activeIdx]);
});

load();
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  let told = false;
  navigator.serviceWorker.addEventListener("message", (e) => {
    if (e.data?.type !== "updated" || told) return;
    told = true; toast("New clips and updates are ready", "Reload", () => location.reload());
  });
}
</script>
</body>
