<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Signal Shorts</title>
<meta name="description" content="The best 60–90 seconds from genuinely good long-form videos.">
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b0c'/%3E%3Cpath d='M6 20h4l3-9 4 13 3-8h6' fill='none' stroke='%23e8ff6b' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0b0c; --card: #121214; --text: #f4f4f2; --muted: #9a9a96; --line: rgba(255,255,255,.12);
    --accent: #e8ff6b; --accent-text: #0b0b0c; --chip: rgba(255,255,255,.08);
    --top: calc(env(safe-area-inset-top) + 56px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 15px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  a { color: inherit; }

  /* topic chips */
  header { position: fixed; z-index: 20; inset: 0 0 auto 0; padding: env(safe-area-inset-top) 0 0;
    background: linear-gradient(rgba(0,0,0,.55), transparent); pointer-events: none; }
  header .chips { pointer-events: auto; }
  .chips { display: flex; gap: 8px; padding: 10px 16px 14px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.14);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--text);
    font-size: 14px; font-weight: 600; white-space: nowrap; transition: background .15s, color .15s; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  .chip .n { opacity: .55; font-weight: 500; margin-left: 4px; }

  /* feed */
  /* A fixed full-screen layer: the browser's address bar never resizes cards mid-swipe. */
  #feed { position: fixed; inset: 0; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain;
    scrollbar-width: none; }
  #feed::-webkit-scrollbar { display: none; }
  .card { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
    padding: var(--top) 16px calc(env(safe-area-inset-bottom) + 20px); }
  .card > * { position: relative; z-index: 1; }
  /* Shorts-style backdrop: the video's own thumbnail, blurred, fills the screen */
  .card > .bg { position: absolute; z-index: 0; inset: -40px; background: #000 center / cover no-repeat;
    filter: blur(28px) brightness(.38) saturate(1.3); }
  .meta-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .tag { color: var(--accent); font-weight: 700; letter-spacing: .02em; text-transform: uppercase; font-size: 12px; }
  .hook { margin: 0; font-size: clamp(22px, 6.4vw, 30px); line-height: 1.15; font-weight: 750;
    letter-spacing: -.02em; text-wrap: balance; }
  .stage { position: relative; width: calc(100% + 32px); margin: 0 -16px; aspect-ratio: 16 / 9; overflow: hidden;
    background: #000 center / cover no-repeat; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .stage iframe, .stage .player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* thumbnail stays on top until the video is really playing, so there is no black flash */
  .poster { position: absolute; inset: 0; z-index: 1; background: #000 center / cover no-repeat;
    transition: opacity .35s; pointer-events: none; }
  .stage.playing .poster { opacity: 0; }
  .tap { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; }
  .pill { position: absolute; z-index: 3; left: 10px; bottom: 12px; display: flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 999px; background: rgba(0,0,0,.66); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); font-size: 13px; font-weight: 600; pointer-events: none;
    transition: opacity .3s; }
  .pill svg { width: 16px; height: 16px; fill: currentColor; }
  .stage.sound .pill { opacity: 0; }
  .paused-icon { width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,.55); display: none;
    place-items: center; }
  .paused-icon svg { width: 28px; height: 28px; fill: #fff; margin-left: 4px; }
  .stage.paused .paused-icon { display: grid; }
  .bar { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.18); }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .src { font-size: 14px; color: rgba(255,255,255,.72); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; }
  .src b { color: var(--text); font-weight: 600; }
  .why { font-size: 14px; color: rgba(255,255,255,.72); margin: -4px 0 0; }
  /* summary from the transcript: 3 lines, tap to open the key points */
  .sum { display: block; text-align: left; font-size: 14.5px; line-height: 1.45; color: rgba(255,255,255,.86);
    margin: -4px 0 0; }
  .sum-text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .sum .points { display: none; margin: 8px 0 0; padding-left: 18px; color: rgba(255,255,255,.78); }
  .sum .points li { margin: 3px 0; }
  .sum-more { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--accent); }
  .sum[aria-expanded="true"] .sum-text { -webkit-line-clamp: unset; }
  .sum[aria-expanded="true"] .points { display: block; }
  .sum[aria-expanded="true"] .sum-more { display: none; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .title-link { color: inherit; text-decoration: underline; text-decoration-color: rgba(255,255,255,.35);
    text-underline-offset: 3px; }
  .title-link:active, .title-link:hover { color: var(--text); text-decoration-color: currentColor; }
  .pill-btn { padding: 7px 13px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: 13px; font-weight: 600; }
  .card[data-i] { touch-action: pan-y; transform-origin: 50% 85%; }
  /* swipe-to-remove: a label waits behind the feed and shows through as the card moves away */
  #feed { z-index: 1; }
  #swipe-hint { position: fixed; z-index: 0; top: 50%; right: 22px; transform: translateY(-50%) scale(.85);
    display: grid; justify-items: center; gap: 8px; color: rgba(255,255,255,.6); font-weight: 700; font-size: 13px;
    opacity: 0; transition: transform .18s, color .18s; pointer-events: none; }
  #swipe-hint svg { width: 30px; height: 30px; fill: currentColor; }
  #swipe-hint.armed { color: var(--accent); transform: translateY(-50%) scale(1.08); }
  .card.leaving { transition: transform .32s cubic-bezier(.5,0,.75,0), opacity .32s; }
  .card.springback { transition: transform .38s cubic-bezier(.2,1.5,.4,1), opacity .25s; }
  .card.entering { animation: enter .42s cubic-bezier(.2,.9,.3,1); }
  @keyframes enter { from { opacity: 0; transform: scale(.94) translateY(14px); } to { opacity: 1; transform: none; } }   /* vertical swipes scroll; horizontal ones are ours */
  .chip.hist { margin-left: auto; }
  .chip.hist[aria-pressed="true"] svg { fill: var(--accent-text); }
  .chip.hist[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  #toast { position: fixed; z-index: 40; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px);
    transform: translate(-50%, 140%); display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 16px;
    border-radius: 999px; background: #f4f4f2; color: #0b0b0c; font-weight: 600; font-size: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); transition: transform .25s, opacity .25s; white-space: nowrap;
    opacity: 0; pointer-events: none; }
  #toast.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  #toast button { color: #0b0b0c; background: var(--accent); padding: 6px 12px; border-radius: 999px; font-weight: 700; }
  #history, #search { position: fixed; z-index: 15; inset: 0; overflow-y: auto; background: var(--bg);
    padding: calc(var(--top) + 4px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  #history[hidden], #search[hidden] { display: none; }
  #q { width: 100%; margin-bottom: 14px; padding: 12px 14px; border-radius: 12px; border: 0; outline: none;
    background: var(--chip); color: var(--text); font: inherit; font-size: 16px; }
  .h-unsave { min-height: 36px; padding: 0 12px; font-size: 13px; }
  .stats { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .stats b { color: var(--text); }
  .play-saved { margin: 0 0 14px; }
  .play-saved svg { width: 18px; height: 18px; fill: currentColor; }
  .new { padding: 2px 7px; border-radius: 6px; background: var(--accent); color: var(--accent-text);
    font-size: 11px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; }
  #mode { position: fixed; z-index: 21; left: 50%; top: calc(env(safe-area-inset-top) + 62px); transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; border-radius: 999px;
    background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: 13px; }
  #mode[hidden] { display: none; }
  #mode button { width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,.15); font-weight: 800; }
  .chip svg { width: 18px; height: 18px; fill: currentColor; display: block; }
  .chip.hist { padding: 7px 11px; }
  .pill-btn { display: inline-flex; align-items: center; gap: 6px; }
  .pill-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .pill-btn.save[aria-pressed="true"] { color: var(--accent); }
  .speed { position: absolute; z-index: 3; top: 10px; right: 10px; padding: 4px 9px; border-radius: 999px;
    background: rgba(0,0,0,.6); font-size: 12.5px; font-weight: 700; }
  .burst { position: absolute; z-index: 4; left: 50%; top: 50%; width: 90px; height: 90px; margin: -45px 0 0 -45px;
    color: var(--accent); opacity: 0; pointer-events: none; }
  .burst svg { width: 100%; height: 100%; fill: currentColor; filter: drop-shadow(0 4px 14px rgba(0,0,0,.5)); }
  .burst.go { animation: burst .8s ease-out; }
  @keyframes burst { 0% { opacity: 0; transform: scale(.4); } 20% { opacity: 1; transform: scale(1.15); }
    45% { transform: scale(.95); } 100% { opacity: 0; transform: scale(1.05) translateY(-30px); } }
  .h-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .h-tabs button { padding: 8px 14px; border-radius: 10px; background: var(--chip); font-weight: 600; font-size: 14px; }
  .h-tabs button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .h-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .h-item { display: grid; grid-template-columns: 120px 1fr auto; gap: 12px; align-items: center; cursor: pointer; }
  .h-item img { width: 120px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; background: #222; }
  .h-meta { display: grid; gap: 3px; min-width: 0; }
  .h-meta b { font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .h-meta span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .h-restore { min-height: 36px; padding: 0 12px; font-size: 13px; }
  .h-empty { color: var(--muted); max-width: 34ch; }
  .h-clear { margin-top: 20px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px;
    padding: 0 18px; border-radius: 12px; background: var(--text); color: var(--bg); font-weight: 700;
    text-decoration: none; font-size: 15px; }
  .btn.ghost { background: var(--chip); color: var(--text); }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }
  .empty { height: 100%; display: grid; place-content: center; text-align: center; gap: 12px; padding: 24px; }
  .empty h2 { margin: 0; font-size: 22px; }
  .empty p { margin: 0; color: var(--muted); max-width: 32ch; }
  @media (min-width: 700px) { .card { padding-left: calc(50% - 280px); padding-right: calc(50% - 280px); }
    .stage { width: 100%; margin: 0; border-radius: 14px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>
<header><nav class="chips" id="chips" aria-label="Topics"></nav></header>
<main id="feed" aria-live="polite"></main>
<div id="swipe-hint" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg><span>Remove video</span></div>
<div id="mode" hidden></div>
<section id="history" hidden aria-label="History"></section>
<section id="search" class="panel" hidden aria-label="Search"></section>
<div id="toast" role="status"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("ss:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ss:" + k, JSON.stringify(v)); } catch {} },
};
const ICON = {
  bookmark: '<svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1zm1 2v12.6l5-2.9 5 2.9V5H7z"/></svg>',
  bookmarkOn: '<svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>',
  share: '<svg viewBox="0 0 24 24"><path d="M12 3l5 5-1.4 1.4L13 6.8V15h-2V6.8L8.4 9.4 7 8l5-5zM5 13h2v6h10v-6h2v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-6z"/></svg>',
  search: '<svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>',
  heart: '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.4C.5 8.5 2.4 4.5 6.3 4.5c2.1 0 3.6 1.1 4.7 2.6 1.1-1.5 2.6-2.6 4.7-2.6 3.9 0 5.8 4 4.3 7.1C19.5 16.4 12 21 12 21z"/></svg>',
  muted: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  yt: '<svg viewBox="0 0 24 24"><path d="M10 15.5v-7l6 3.5-6 3.5zM21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4a2.5 2.5 0 0 0-1.8 1.8C2 8.8 2 12 2 12s0 3.2.4 4.8a2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8z"/></svg>',
};
const fmtTime = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const fmtViews = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e3 ? Math.round(n / 1e3) + "K" : String(n);

let topics = [], clips = [], seen = new Set(store.get("seen", []).map(String)), selected = store.get("selected", null);

async function load() {
  const [t, c] = await Promise.all([
    fetch("topics.json", { cache: "no-cache" }).then((r) => r.json()).catch(() => []),
    fetch("clips.json", { cache: "no-cache" }).then((r) => r.json()).catch(() => []),
  ]);
  topics = t.filter((x) => c.some((k) => k.topic === x.id));
  clips = c;
  markNew();
  bestOf = {};
  for (const k of clips) if (!bestOf[k.vid] || k.substance > bestOf[k.vid].substance) bestOf[k.vid] = k;
  const ids = topics.map((x) => x.id);
  selected = (selected || ids).filter((id) => ids.includes(id));
  if (!selected.length) selected = ids;
  renderChips();
  const shared = new URLSearchParams(location.search).get("clip");   // opened from a shared link
  $("#mode").addEventListener("click", () => { renderFeed(); renderChips(); });
  if (!(shared && playFirst({ id: shared, vid: shared.slice(0, 11), start: +shared.slice(12) }))) renderFeed();
  if (shared) window.history.replaceState(null, "", location.pathname);
}

function isSeen(c) {
  if (seen.has(c.id)) return true;
  if (seen.has(c.vid) && c === bestOf[c.vid]) return true;   // old history: one clip per video
  for (const s of seen) {
    if (s.length > 12 && s.slice(0, 11) === c.vid && Math.abs(+s.slice(12) - c.start) < 90) return true;
  }
  return false;
}
let bestOf = {};   // video id -> its highest-scoring clip
let skips = store.get("skips", {});                // clip id -> times swiped away early
let removed = new Set(store.get("removed", []));   // video ids removed with a left swipe
let history = store.get("history", []);            // newest first: watched and removed clips
let watchLog = store.get("watchLog", {});         // "YYYY-MM-DD" -> seconds watched
let unsavedSecs = 0;
function addWatchTime(s) {
  const day = new Date().toISOString().slice(0, 10);
  watchLog[day] = (watchLog[day] || 0) + s;
  if ((unsavedSecs += s) >= 5) { unsavedSecs = 0; store.set("watchLog", watchLog); }
}
function weekStats() {
  const since = Date.now() - 7 * 864e5, cutoff = new Date(since).toISOString().slice(0, 10);
  const secs = Object.entries(watchLog).filter(([d]) => d >= cutoff).reduce((a, [, s]) => a + s, 0);
  const n = history.filter((h) => h.kind === "watched" && h.at >= since).length;
  return { n, min: Math.round(secs / 60) };
}
let saved = store.get("saved", []);               // newest first: clips you saved
let rate = store.get("rate", 1);                   // playback speed, remembered
const RATES = [1, 1.25, 1.5, 2];
const isSaved = (c) => saved.some((s) => s.id === c.id);
const SKIP_LIMIT = 2;                              // swiped away early twice: gone
// Clips published since your last visit stay "new" (first in the feed, with a badge) until you watch them.
let fresh = new Set(store.get("fresh", []));
function markNew() {
  const known = store.get("known", null), ids = clips.map((c) => c.id);
  if (known) { const k = new Set(known); for (const id of ids) if (!k.has(id)) fresh.add(id); }
  fresh = new Set([...fresh].filter((id) => ids.includes(id)));
  store.set("known", ids); store.set("fresh", [...fresh]);
}
const isNew = (c) => fresh.has(c.id) && !isSeen(c);
const available = (c) => !isSeen(c) && !removed.has(c.vid) && (skips[c.id] || 0) < SKIP_LIMIT;

function logHistory(c, kind) {
  history = [{ kind, id: c.id, vid: c.vid, hook: c.hook, title: c.title, channel: c.channel, topic: c.topic,
               start: c.start, end: c.end, at: Date.now() },
             ...history.filter((h) => !(h.id === c.id && h.kind === kind))].slice(0, 300);
  store.set("history", history);
}

// ---------- chips: "Mix" = every topic interleaved; tap a topic to focus it, tap more to mix them
function renderChips() {
  const all = selected.length === topics.length && !historyOpen && !searchOpen;
  const count = (id) => clips.filter((c) => c.topic === id && available(c)).length;
  $("#chips").innerHTML = (topics.length > 1 ? `<button class="chip" data-id="*" aria-pressed="${all}">Mix</button>` : "") +
    topics.map((t) => `<button class="chip" data-id="${esc(t.id)}" aria-pressed="${!historyOpen && !searchOpen && !all && selected.includes(t.id) && selected.length < topics.length}">
      ${esc(t.name)}<span class="n">${count(t.id)}</span></button>`).join("") +
    `<button class="chip hist" data-id="search" aria-pressed="${searchOpen}" aria-label="Search">${ICON.search}</button>` +
    `<button class="chip" data-id="history" aria-pressed="${historyOpen}">History</button>`;
}
$("#chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  if (b.dataset.id === "history") { historyOpen ? closeHistory() : openHistory(); return; }
  if (b.dataset.id === "search") { searchOpen ? closeSearch() : openSearch(); return; }
  if (historyOpen) closeHistory(false);
  if (searchOpen) closeSearch(false);
  const id = b.dataset.id, all = selected.length === topics.length, ids = topics.map((t) => t.id);
  if (id === "*") selected = ids;
  else if (all) selected = [id];
  else if (selected.includes(id)) selected = selected.length === 1 ? ids : selected.filter((x) => x !== id);
  else selected = [...selected, id];
  store.set("selected", selected);
  renderChips(); renderFeed();
});

// ---------- feed: round-robin across selected topics, unseen first, best substance first
const GAP = 6;   // cards between two clips of the same video
function buildOrder() {

  const url = `${location.origin}${location.pathname}?clip=${encodeURIComponent(c.id)}`;
  try {
    if (navigator.share) { await navigator.share({ title: c.hook, text: `${c.hook} (${c.channel})`, url }); return; }
    await navigator.clipboard.writeText(url); toast("Link copied");
  } catch (e) {
    if (e?.name !== "AbortError") prompt("Copy this link:", url);
  }
}

// ---------- Search: hooks, summaries, key points, titles, channels and subjects
let searchOpen = false;
function openSearch() {
  if (historyOpen) closeHistory(false);
  searchOpen = true; player?.pauseVideo?.();
  const s = $("#search"); s.hidden = false;
  s.innerHTML = `<input id="q" type="search" placeholder="Search clips: RAG, Karpathy, pricing…" autocomplete="off" enterkeyhint="search">
    <ul class="h-list" id="results"></ul>`;
  $("#q").addEventListener("input", runSearch);
  runSearch(); renderChips(); setTimeout(() => $("#q").focus(), 50);
}
function closeSearch(rerender = true) { searchOpen = false; $("#search").hidden = true; if (rerender) renderChips(); }
function runSearch() {
  const terms = $("#q").value.toLowerCase().split(/\s+/).filter(Boolean);
  const name = topicName();
  const hay = (c) => [c.hook, c.summary, ...(c.points || []), c.title, c.channel, c.subject, name[c.topic]].join(" ").toLowerCase();
  const hits = terms.length ? clips.filter((c) => !removed.has(c.vid) && terms.every((t) => hay(c).includes(t)))
    .sort((a, b) => b.substance - a.substance).slice(0, 60) : [];
  $("#results").innerHTML = !terms.length ? `<p class="h-empty">Search every clip by what's said in it, its title or its channel.</p>`
    : hits.length ? hits.map((c) => `
      <li class="h-item" data-id="${esc(c.id)}">
        <img src="https://i.ytimg.com/vi/${esc(c.vid)}/mqdefault.jpg" alt="" loading="lazy">
        <div class="h-meta"><b>${esc(c.hook)}</b><span>${esc(c.channel)}${isSeen(c) ? " · watched" : ""}</span></div>
      </li>`).join("") : `<p class="h-empty">No clips match “${esc(terms.join(" "))}”.</p>`;
}
$("#search").addEventListener("click", (e) => {
  const item = e.target.closest(".h-item"); if (!item) return;
  closeSearch(); playFirst({ id: item.dataset.id });
});

let lastTap = 0, tapTimer = null;
$("#feed").addEventListener("click", (e) => {
  const card = e.target.closest(".card[data-i]"), c = card && order[+card.dataset.i];
  if (e.target.closest(".save") && c) { toggleSave(c); return; }
  if (e.target.closest(".share") && c) { shareClip(c); return; }
  if (e.target.closest(".speed")) {
    rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length]; store.set("rate", rate);
    document.querySelectorAll(".speed").forEach((b) => (b.textContent = `${rate}×`));
    for (const { player: pl, ready } of players.values()) if (ready) pl.setPlaybackRate?.(rate);
    return;
  }
  const tap = e.target.closest(".tap"); if (!tap || !player || !activeCard?.contains(tap)) return;
  const stage = tap.closest(".stage"), now = Date.now();
  if (now - lastTap < 300) {   // double-tap: save, with a heart
    clearTimeout(tapTimer); lastTap = 0;
    if (c && !isSaved(c)) { save(c); toast("Saved · find it in History", "View", () => { historyTab = "saved"; openHistory(); }); }
    const h = stage.querySelector(".burst"); h.classList.remove("go"); void h.offsetWidth; h.classList.add("go");
    return;
  }
  lastTap = now;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => {   // single tap: sound on, or pause / play
    interacted = true; soundRefused = false;
    if (player.isMuted()) { player.unMute(); player.setVolume(100); stage.classList.add("sound"); player.playVideo(); }
    else if (player.getPlayerState?.() !== YT.PlayerState.PLAYING) player.playVideo();
    else player.pauseVideo();
  }, 260);
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) return;
  player?.pauseVideo?.();
  store.set("watchLog", watchLog);
  const c = watchedClip; if (c && watched >= (c.end - c.start) * 0.5) markSeen(c);   // leaving the app: no skip
});
document.addEventListener("keydown", (e) => {
  if (searchOpen || e.target.closest?.("input")) { if (e.key === "Escape") closeSearch(); return; }
  const feed = $("#feed");
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); feed.scrollBy({ top: innerHeight, behavior: "smooth" }); }
  if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); feed.scrollBy({ top: -innerHeight, behavior: "smooth" }); }
  if (e.key === " " || e.key === "m") { e.preventDefault(); activeCard?.querySelector(".tap").click(); }
  if (e.key === "x" && activeCard) removeVideo(activeCard);
  if (e.key === "s" && activeCard) toggleSave(order[activeIdx]);
});

load();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
